<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-label="MOBIUS RUNNER animated topology game field">
<defs>
  <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58a6ff"/>
    <stop offset=".48" stop-color="#bc8cff"/>
    <stop offset="1" stop-color="#3fb950"/>
  </linearGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".35" stop-color="#7ee787"/>
    <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="1" opacity=".34"/>
  </pattern>
</defs>

<style>
  :root{--bg:#0d1117;--panel:#111820;--fg:#e6edf3;--muted:#9aa4af;--line:#30363d;--blue:#58a6ff;--purple:#bc8cff;--green:#3fb950;--hot:#f78166}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}
  .title{font:700 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
  .label{font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.09em}
  .small{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
  @media(prefers-color-scheme:light){:root{--bg:#fff;--panel:#f6f8fa;--fg:#24292f;--muted:#57606a;--line:#d0d7de;--blue:#0969da;--purple:#8250df;--green:#1a7f37;--hot:#cf222e}}
</style>

<rect width="1200" height="390" rx="18" fill="var(--bg)"/>
<rect x="24" y="100" width="1152" height="250" rx="16" fill="url(#grid)" stroke="var(--line)"/>

<text x="44" y="42" class="fg title">ARAVINDHAN / MÖBIUS.RUNNER</text>
<text x="44" y="69" class="muted small">one surface · endless lap · topology becomes the game world</text>
<line x1="44" y1="88" x2="1156" y2="88" stroke="var(--line)"/>

<!-- HUD -->
<g transform="translate(43 119)">
  <rect width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="16" y="24" class="muted tiny">RUN STATE</text>
  <text x="16" y="47" class="fg small">LAP     ∞</text>
  <text x="16" y="68" class="fg small">SURFACE ONE-SIDED</text>
  <text x="16" y="88" class="fg small">MODE    TOPOLOGY SHIFT</text>
</g>

<!-- energy bar -->
<g transform="translate(43 229)">
  <rect width="226" height="65" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="16" y="22" class="muted tiny">ENERGY</text>
  <rect x="16" y="34" width="194" height="10" rx="5" fill="var(--line)"/>
  <rect x="16" y="34" height="10" rx="5" fill="url(#track)">
    <animate attributeName="width" values="70;194;118;180;70" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="16" y="58" class="muted tiny">VELOCITY / PHASE LOCK</text>
</g>

<!-- Möbius-style ribbon: rear surface -->
<path d="M324 225 C390 123 515 122 605 214 C695 306 830 310 916 224 C1002 138 1070 152 1126 214 C1070 278 1002 288 916 205 C830 122 695 126 605 218 C515 310 390 312 324 225Z"
      fill="#111820" stroke="var(--line)" stroke-width="1.5"/>

<!-- ribbon inner bands -->
<path d="M342 225 C404 147 510 148 592 222 C676 298 808 294 896 219 C984 144 1058 161 1108 214"
      fill="none" stroke="url(#track)" stroke-width="30" stroke-linecap="round" opacity=".22"/>
<path d="M342 225 C404 147 510 148 592 222 C676 298 808 294 896 219 C984 144 1058 161 1108 214"
      fill="none" stroke="url(#track)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="10 16" opacity=".95">
  <animate attributeName="stroke-dashoffset" values="0;-156" dur="5s" repeatCount="indefinite"/>
</path>

<!-- crossing/front ribbon to create the twist -->
<path d="M342 225 C404 303 510 302 592 228 C676 152 808 156 896 231 C984 306 1058 289 1108 214"
      fill="none" stroke="url(#track)" stroke-width="32" stroke-linecap="round" opacity=".16"/>
<path d="M342 225 C404 303 510 302 592 228 C676 152 808 156 896 231 C984 306 1058 289 1108 214"
      fill="none" stroke="#bc8cff" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 17" opacity=".7">
  <animate attributeName="stroke-dashoffset" values="0;144" dur="6.5s" repeatCount="indefinite"/>
</path>

<!-- topology checkpoints -->
<g transform="translate(470 170)">
  <circle r="30" fill="var(--panel)" stroke="var(--blue)" stroke-width="1.8" stroke-dasharray="5 7">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="13" fill="none" stroke="var(--blue)" opacity=".7">
    <animate attributeName="r" values="10;18;10" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</g>
<g transform="translate(744 252)">
  <polygon points="0,-31 27,-15 27,15 0,31 -27,15 -27,-15" fill="var(--panel)" stroke="var(--green)" stroke-width="1.8">
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8.5s" repeatCount="indefinite"/>
  </polygon>
  <circle r="9" fill="var(--green)" opacity=".7">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</g>
<g transform="translate(1002 183)">
  <rect x="-25" y="-25" width="50" height="50" rx="11" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.8">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
  </rect>
  <circle r="11" fill="none" stroke="var(--purple)" opacity=".8">
    <animate attributeName="r" values="7;17;7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- runner: bright core travels the one-sided loop -->
<g filter="url(#glow)">
  <circle r="18" fill="url(#core)" opacity=".65">
    <animate attributeName="r" values="13;22;13" dur="1.1s" repeatCount="indefinite"/>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M342 225 C404 147 510 148 592 222 C676 298 808 294 896 219 C984 144 1058 161 1108 214 C1058 289 984 306 896 231 C808 156 676 152 592 228 C510 302 404 303 342 225"/>
  </circle>
  <polygon points="0,-8 8,0 0,8 -8,0" fill="var(--green)" stroke="var(--fg)" stroke-width="1.2">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M342 225 C404 147 510 148 592 222 C676 298 808 294 896 219 C984 144 1058 161 1108 214 C1058 289 984 306 896 231 C808 156 676 152 592 228 C510 302 404 303 342 225"/>
  </polygon>
</g>

<!-- chase particles -->
<g opacity=".7"><circle r="4" fill="var(--blue)"><animateMotion dur="8s" begin="-1.1s" repeatCount="indefinite" path="M342 225 C404 147 510 148 592 222 C676 298 808 294 896 219 C984 144 1058 161 1108 214 C1058 289 984 306 896 231 C808 156 676 152 592 228 C510 302 404 303 342 225"/></circle></g>
<g opacity=".5"><circle r="3.5" fill="var(--purple)"><animateMotion dur="8s" begin="-2.2s" repeatCount="indefinite" path="M342 225 C404 147 510 148 592 222 C676 298 808 294 896 219 C984 144 1058 161 1108 214 C1058 289 984 306 896 231 C808 156 676 152 592 228 C510 302 404 303 342 225"/></circle></g>
<g opacity=".34"><circle r="3" fill="var(--hot)"><animateMotion dur="8s" begin="-3.3s" repeatCount="indefinite" path="M342 225 C404 147 510 148 592 222 C676 298 808 294 896 219 C984 144 1058 161 1108 214 C1058 289 984 306 896 231 C808 156 676 152 592 228 C510 302 404 303 342 225"/></circle></g>

<!-- start/finish pulse -->
<g transform="translate(342 225)">
  <circle r="12" fill="none" stroke="var(--hot)" stroke-width="1.4">
    <animate attributeName="r" values="10;32;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.08;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="var(--hot)"/>
</g>

<!-- scan beam for arcade feel -->
<rect x="302" y="115" width="3" height="218" fill="var(--green)" opacity=".18">
  <animate attributeName="x" values="302;1136;302" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".03;.34;.03" dur="10s" repeatCount="indefinite"/>
</rect>

<!-- labels -->
<text x="308" y="333" class="muted tiny">START / FINISH</text>
<text x="444" y="130" class="muted tiny">TWIST GATE</text>
<text x="699" y="319" class="muted tiny">PHASE LOCK</text>
<text x="959" y="132" class="muted tiny">ORIENTATION FLIP</text>
<text x="950" y="366" class="muted tiny">∞ ENDLESS TOPOLOGY RUN</text>
</svg>
