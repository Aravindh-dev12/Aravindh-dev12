name: Build transparent Rocky GIF

on:
  push:
    paths:
      - '.github/workflows/build-rocky-transparent-gif.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Remove background from STL turntable
        shell: bash
        run: |
          set -euo pipefail
          convert assets/rocky-3d-preview.gif -coalesce -fuzz 12% -transparent '#e4e3e3' -resize 560x560 -layers Optimize assets/rocky-stl-transparent.gif
          test -s assets/rocky-stl-transparent.gif
          file assets/rocky-stl-transparent.gif

      - name: Commit transparent STL preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rocky-stl-transparent.gif
          git commit -m 'Add transparent Rocky STL preview'
          git push
