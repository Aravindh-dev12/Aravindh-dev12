name: Fix Rocky STL shading

on:
  push:
    paths:
      - '.github/workflows/fix-rocky-rendering.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair STL normals and force sandstone shader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rocky-3d/index.html')
          s = p.read_text()

          # Keep color handling simple and deterministic for STL geometry.
          s = s.replace(
              "renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.20;",
              "renderer.toneMapping=THREE.NoToneMapping;renderer.toneMappingExposure=1;",
              1,
          )

          old_mat = "const stoneMat=new THREE.MeshStandardMaterial({color:0xa98a70,roughness:.90,metalness:0,side:THREE.DoubleSide});"
          new_mat = "const stoneMat=new THREE.MeshPhongMaterial({color:0xa98a70,emissive:0x2a1f18,emissiveIntensity:.18,shininess:4,specular:0x3a2c22,side:THREE.DoubleSide});"
          if old_mat not in s:
              raise SystemExit('current stone material not found')
          s = s.replace(old_mat, new_mat, 1)

          old_geom = "async function partGeometry(name){const meta=manifest.parts[name];const buf=await gunzip(`./assets/action/${meta.gzip}`);const g=loader.parse(buf);g.computeBoundingBox();g.translate(-meta.center[0],-meta.center[1],-meta.min[2]);return g}"
          new_geom = "async function partGeometry(name){const meta=manifest.parts[name];const buf=await gunzip(`./assets/action/${meta.gzip}`);const g=loader.parse(buf);if(g.hasAttribute('color'))g.deleteAttribute('color');if(g.hasAttribute('normal'))g.deleteAttribute('normal');g.computeVertexNormals();g.normalizeNormals();g.computeBoundingBox();g.translate(-meta.center[0],-meta.center[1],-meta.min[2]);return g}"
          if old_geom not in s:
              raise SystemExit('partGeometry function not found')
          s = s.replace(old_geom, new_geom, 1)

          old_mesh = "function meshFrom(g,mat=stoneMat){const m=new THREE.Mesh(g,mat);m.scale.setScalar(scale);m.castShadow=m.receiveShadow=true;return m}"
          new_mesh = "function meshFrom(g,mat=stoneMat){const useMat=mat===stoneMat?stoneMat.clone():mat;const m=new THREE.Mesh(g,useMat);if(useMat===m.material&&m.material.color&&mat===stoneMat){m.material.color.setHex(0xa98a70);m.material.emissive.setHex(0x2a1f18);m.material.needsUpdate=true}m.scale.setScalar(scale);m.castShadow=m.receiveShadow=true;return m}"
          if old_mesh not in s:
              raise SystemExit('meshFrom function not found')
          s = s.replace(old_mesh, new_mesh, 1)

          # Strong neutral fill so the tan base remains visible from every angle.
          s = s.replace(
              "scene.add(new THREE.AmbientLight(0xffffff,.72));",
              "scene.add(new THREE.AmbientLight(0xffffff,1.15));",
              1,
          )

          p.write_text(s)
          PY

          grep -q 'MeshPhongMaterial({color:0xa98a70' rocky-3d/index.html
          grep -q "deleteAttribute('color')" rocky-3d/index.html
          grep -q 'THREE.NoToneMapping' rocky-3d/index.html

      - name: Commit shading fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocky-3d/index.html
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix black Rocky STL shading'
          git push
