name: VECTOR STORM README Game

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      command:
        description: Game command
        required: true
        default: tick
        type: choice
        options:
          - tick
          - up
          - down
          - left
          - right
          - boost
          - reset

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'storm:')
    runs-on: ubuntu-latest
    concurrency:
      group: vector-storm-readme-game
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Advance game
        env:
          GAME_COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.command || github.event.issue.title }}
        run: python scripts/vector_storm_game.py

      - name: Commit game state and README board
        run: |
          git config user.name "vector-storm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/vector_storm_state.json README.md
          if git diff --cached --quiet; then
            echo "No game changes"
          else
            git commit -m "game: advance Vector Storm"
            git push origin HEAD:main
          fi

      - name: Reply and close move issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file .game_message
          gh issue close "$ISSUE_NUMBER" --reason completed
