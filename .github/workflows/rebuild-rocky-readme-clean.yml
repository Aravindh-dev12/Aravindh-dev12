name: Rebuild clean Rocky README preview

on:
  push:
    paths:
      - '.github/workflows/rebuild-rocky-readme-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract best full-body frame
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageSequence
          from pathlib import Path

          src = Path('assets/rocky-stl-transparent.gif')
          if not src.exists():
              raise SystemExit(f'missing {src}')

          gif = Image.open(src)
          best = None
          best_score = None
          best_meta = None

          for idx, frame in enumerate(ImageSequence.Iterator(gif)):
              rgba = frame.convert('RGBA')
              alpha = rgba.getchannel('A')
              bbox = alpha.getbbox()
              if not bbox:
                  continue
              x0, y0, x1, y1 = bbox
              bw, bh = x1-x0, y1-y0
              w, h = rgba.size
              edge_hits = int(x0 <= 2) + int(y0 <= 2) + int(x1 >= w-2) + int(y1 >= h-2)
              cx = (x0+x1)/2
              cy = (y0+y1)/2
              center_penalty = abs(cx-w/2)/w + abs(cy-h/2)/h
              compactness = max(bw/w, bh/h)
              score = edge_hits*10 + compactness + center_penalty*0.4
              if best_score is None or score < best_score:
                  best_score = score
                  best = rgba
                  best_meta = (idx, bbox, score)

          if best is None:
              raise SystemExit('no visible frame found')

          bbox = best.getchannel('A').getbbox()
          best = best.crop(bbox)

          # Keep the full model within a stable transparent canvas.
          max_w, max_h = 760, 480
          scale = min(max_w / best.width, max_h / best.height, 1.0)
          if scale != 1.0:
              best = best.resize((round(best.width*scale), round(best.height*scale)), Image.Resampling.LANCZOS)

          canvas = Image.new('RGBA', (900, 560), (0,0,0,0))
          x = (canvas.width-best.width)//2
          y = (canvas.height-best.height)//2
          canvas.alpha_composite(best, (x,y))

          out = Path('assets/rocky-readme-clean-v4.png')
          canvas.save(out, optimize=True)
          print('selected', best_meta, 'saved', out, canvas.size, 'subject', best.size, 'offset', (x,y))
          PY
          file assets/rocky-readme-clean-v4.png

      - name: Update README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('README.md')
          s = p.read_text()
          block = '<div align="center">\n\n<img src="./assets/rocky-readme-clean-v4.png" width="700" alt="Rocky — transparent full 3D model" />\n\n</div>'
          s2, n = re.subn(r'<div align="center">\s*<img src="\./assets/rocky-[^"]+"[^>]*>\s*</div>', block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Rocky README image block not found')
          p.write_text(s2)
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rocky-readme-clean-v4.png README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix Rocky README image rendering and framing'
          git push
