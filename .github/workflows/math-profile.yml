name: Generate mathematical profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_math_profile.py"
      - "scripts/generate_math_sections.py"
      - ".github/workflows/math-profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate mathematical profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Aravindh-dev12
        run: |
          python scripts/generate_math_profile.py
          python scripts/generate_math_sections.py

      - name: Commit changed visualizations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/math-profile.svg assets/identity-state.svg assets/systems-in-motion.svg assets/operating-system.svg assets/design-constraints.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh mathematical profile"
          git push
