<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0d1117" />
<title>Moving Rocky</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#202824 0,#111715 42%,#0d1117 78%);color:#d9e1dc;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:4;left:16px;top:14px;padding:9px 11px;border:1px solid rgba(111,255,194,.16);border-radius:12px;background:rgba(8,13,12,.42);backdrop-filter:blur(9px);pointer-events:none}.hud b{display:block;font-size:11px;letter-spacing:.09em;color:#e9e0d6}.hud span{display:block;margin-top:5px;font-size:9px;letter-spacing:.06em;color:#7de5b8}.hint{position:fixed;z-index:4;right:14px;bottom:12px;font-size:9px;color:#6f7b75;pointer-events:none}@media(max-width:650px){.hud{left:10px;top:10px}.hint{right:10px;bottom:9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud"><b>ROCKY / MOVING 3D</b><span>procedural geometry · no STL · no GLB</span><span>walking automatically</span></div>
<div class="hint">drag = orbit · wheel = zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.14;

const scene=new THREE.Scene();
scene.background=null;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.03).texture;
pmrem.dispose();

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,80);
camera.position.set(6.1,3.9,7.4);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=false;
controls.target.set(0,1.65,0);controls.minDistance=4.8;controls.maxDistance=13;controls.maxPolarAngle=Math.PI*.49;

scene.add(new THREE.HemisphereLight(0xfff1df,0x17201d,1.7));
const key=new THREE.DirectionalLight(0xffddbd,4.1);key.position.set(5.5,8,5.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-7;key.shadow.camera.right=7;key.shadow.camera.top=7;key.shadow.camera.bottom=-7;scene.add(key);
const fill=new THREE.DirectionalLight(0xb9d9d0,1.5);fill.position.set(-5,4,3);scene.add(fill);
const rim=new THREE.DirectionalLight(0x63e0ad,1.1);rim.position.set(-4,5,-5);scene.add(rim);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({color:0x000000,opacity:.30}));
floor.rotation.x=-Math.PI/2;floor.position.y=0;floor.receiveShadow=true;scene.add(floor);

const stone=new THREE.MeshPhysicalMaterial({color:0xA98A70,roughness:.92,metalness:0,clearcoat:.018,clearcoatRoughness:.96,envMapIntensity:.72});
const stoneWarm=new THREE.MeshPhysicalMaterial({color:0xB89475,roughness:.95,metalness:0,envMapIntensity:.62});
const seam=new THREE.MeshStandardMaterial({color:0x4d3b30,roughness:1,metalness:0});
const glow=new THREE.MeshPhysicalMaterial({color:0x5FB285,emissive:0x45d89c,emissiveIntensity:2.35,roughness:.28,metalness:.02,clearcoat:.18,clearcoatRoughness:.24});
const glowHalo=new THREE.MeshBasicMaterial({color:0x76D9B3,transparent:true,opacity:.11,depthWrite:false,blending:THREE.AdditiveBlending});

function roughRock(radius=1,detail=2,seed=1){
  const g=new THREE.IcosahedronGeometry(radius,detail),p=g.attributes.position,v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n=1+.035*Math.sin(v.x*5.7+seed)+.026*Math.sin(v.y*8.3+seed*1.7)+.02*Math.sin(v.z*11.1-seed*.9);
    v.multiplyScalar(n);p.setXYZ(i,v.x,v.y,v.z);
  }
  g.computeVertexNormals();return g;
}
function rock(radius,mat=stone,seed=1){const m=new THREE.Mesh(roughRock(radius,2,seed),mat);m.castShadow=m.receiveShadow=true;return m}
function joint(radius=.18){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(radius,2),seam);m.castShadow=true;return m}
function mineral(parent,pos,r=.10,scale=[1.35,.55,.9]){const c=rock(r,glow,7);c.position.set(...pos);c.scale.set(...scale);parent.add(c);const h=new THREE.Mesh(new THREE.SphereGeometry(r*1.7,14,9),glowHalo);h.position.copy(c.position);h.scale.copy(c.scale);parent.add(h)}
function addCracks(parent,items){for(const [x,y,z,s,rx,ry,rz] of items){const m=new THREE.Mesh(new THREE.BoxGeometry(s,.018,.014),seam);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);parent.add(m)}}

const rocky=new THREE.Group();scene.add(rocky);rocky.position.y=2.62;rocky.rotation.y=-.26;
const body=rock(1.05,stone,2);body.scale.set(1.35,.92,1.05);rocky.add(body);
const belly=rock(.73,stoneWarm,3);belly.position.set(0,-.86,.12);belly.scale.set(.95,1.12,.88);rocky.add(belly);
const topPlate=rock(.74,stoneWarm,5);topPlate.position.set(-.03,.56,-.03);topPlate.scale.set(1.27,.42,1.0);rocky.add(topPlate);
addCracks(body,[[-.20,.17,.97,.48,.03,.15,.24],[.33,-.12,.93,.42,-.05,-.1,-.33],[-.53,-.26,.72,.32,.2,.15,.48]]);
mineral(body,[-.46,.38,.77],.11);mineral(body,[.54,.12,.70],.095,[1.1,.52,1.0]);mineral(belly,[-.12,.05,.67],.095,[1.2,.6,.8]);mineral(topPlate,[.24,.13,.57],.09,[1.2,.5,.8]);

const limbDefs=[
  {angle:-2.45,phase:0.00,shoulder:1.05,l1:1.12,l2:1.02,seed:11},
  {angle:-1.15,phase:.40,shoulder:1.04,l1:1.18,l2:1.00,seed:17},
  {angle:0.00,phase:.80,shoulder:1.10,l1:1.28,l2:1.08,seed:23},
  {angle:1.15,phase:1.20,shoulder:1.04,l1:1.18,l2:1.00,seed:29},
  {angle:2.45,phase:1.60,shoulder:1.05,l1:1.12,l2:1.02,seed:31}
];
const limbs=[];
function makeLimb(d,i){
  const root=new THREE.Group();root.rotation.y=d.angle;rocky.add(root);
  const shoulderX=Math.cos(d.angle)*d.shoulder,shoulderZ=Math.sin(d.angle)*d.shoulder;
  root.position.set(shoulderX,-.02,shoulderZ);root.rotation.y=-d.angle;
  const shoulder=joint(.22);root.add(shoulder);
  const upperPivot=new THREE.Group();root.add(upperPivot);
  const upper=rock(.36,i%2?stoneWarm:stone,d.seed);upper.scale.set(.62,d.l1,.62);upper.position.y=-d.l1*.54;upperPivot.add(upper);mineral(upper,[.17,-.08,.20],.075,[1.2,.5,.9]);
  const elbowPivot=new THREE.Group();elbowPivot.position.y=-d.l1;upperPivot.add(elbowPivot);elbowPivot.add(joint(.185));
  const lower=rock(.31,stone,d.seed+3);lower.scale.set(.56,d.l2,.55);lower.position.y=-d.l2*.53;elbowPivot.add(lower);
  if(i===1||i===4)mineral(lower,[-.12,-.06,.18],.07,[1.05,.5,.85]);
  const hand=new THREE.Group();hand.position.y=-d.l2;elbowPivot.add(hand);hand.add(joint(.15));
  const digitAngles=[-.34,0,.34];
  digitAngles.forEach((a,k)=>{const f=rock(.19,stoneWarm,d.seed+8+k);f.scale.set(.52,.78,.46);f.position.set(Math.sin(a)*.23,-.27,Math.cos(a)*.06);f.rotation.z=a*.8;hand.add(f)});
  if(i===0||i===3)mineral(hand,[0,-.08,.12],.065,[1.0,.55,.75]);
  return{...d,i,root,upperPivot,elbowPivot,hand};
}
limbDefs.forEach((d,i)=>limbs.push(makeLimb(d,i)));

const clock=new THREE.Clock();
function animateLimb(L,t){
  const cycle=t*1.58+L.phase*Math.PI*2;
  const swing=Math.sin(cycle),lift=Math.max(0,Math.sin(cycle));
  const side=Math.sin(L.angle);
  L.root.position.y=-.03+lift*.11;
  L.upperPivot.rotation.z=.73+swing*.22;
  L.upperPivot.rotation.x=side*.08+Math.cos(cycle)*.07;
  L.elbowPivot.rotation.z=-1.12+lift*.54-Math.cos(cycle)*.08;
  L.hand.rotation.z=-.18-swing*.10;
  L.hand.rotation.x=Math.cos(cycle)*.07;
}
function animateBody(t){
  rocky.position.y=2.62+Math.sin(t*3.16)*.055;
  rocky.position.x=Math.sin(t*.79)*.07;
  rocky.rotation.z=Math.sin(t*1.58)*.035;
  rocky.rotation.y=-.26+Math.sin(t*.42)*.045;
  body.rotation.x=Math.sin(t*1.58)*.025;
  belly.rotation.x=-.05+Math.sin(t*1.58+.7)*.04;
  topPlate.rotation.z=Math.sin(t*1.58)*.018;
}
function tick(){requestAnimationFrame(tick);const t=clock.getElapsedTime();limbs.forEach(L=>animateLimb(L,t));animateBody(t);controls.update();renderer.render(scene,camera)}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});
</script>
</body>
</html>
