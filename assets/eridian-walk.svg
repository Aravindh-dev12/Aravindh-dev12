<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="225" viewBox="0 0 1000 225" role="img" aria-label="Rocky-inspired cracked stone alien walking across the profile">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98a64"/>
      <stop offset="0.22" stop-color="#9b7154"/>
      <stop offset="0.58" stop-color="#76533f"/>
      <stop offset="0.82" stop-color="#5a3e31"/>
      <stop offset="1" stop-color="#3e2c24"/>
    </linearGradient>
    <linearGradient id="rockDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#91674d"/>
      <stop offset="0.55" stop-color="#694936"/>
      <stop offset="1" stop-color="#422f27"/>
    </linearGradient>
    <linearGradient id="rockHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0a47e" stop-opacity=".72"/>
      <stop offset="1" stop-color="#8d6248" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mineral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62c3a5"/>
      <stop offset="0.45" stop-color="#379f87"/>
      <stop offset="1" stop-color="#1e7366"/>
    </linearGradient>
    <filter id="stoneTexture" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-80%" y="-250%" width="260%" height="600%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- thick two-segment Rocky-like limb, hinge at 0,0 -->
    <g id="limb">
      <path d="M-10 0 C5 -8 24 -4 34 8 C42 18 41 35 35 49 L24 75 C20 87 8 93 -4 88 C-16 83 -21 72 -17 59 L-8 31 C-5 19 -17 8 -10 0 Z"
            fill="url(#rock)" stroke="#3f2d24" stroke-width="2"/>
      <path d="M-7 5 C5 -1 20 2 28 11" fill="none" stroke="url(#rockHi)" stroke-width="4" stroke-linecap="round"/>
      <path d="M-12 30 L-3 35 L5 29 L16 34 L27 27" fill="none" stroke="#3f2d24" stroke-opacity=".75" stroke-width="2"/>
      <path d="M-2 54 L8 60 L17 53 L28 58" fill="none" stroke="#4d352a" stroke-opacity=".75" stroke-width="2"/>

      <g transform="translate(20 70)">
        <path d="M-5 0 C8 -5 23 1 29 13 C35 25 29 42 18 58 L7 75 C0 86 -14 90 -24 83 C-33 76 -34 65 -27 54 L-13 31 C-7 21 -16 7 -5 0 Z"
              fill="url(#rockDark)" stroke="#3b2922" stroke-width="2"/>
        <path d="M-3 7 C8 3 19 7 24 14" fill="none" stroke="#c89a74" stroke-opacity=".44" stroke-width="3" stroke-linecap="round"/>
        <path d="M-21 56 L-10 61 L0 55 L10 60 L20 53" fill="none" stroke="#3d2b23" stroke-width="2" opacity=".8"/>
        <path d="M-27 73 C-15 69 4 70 16 75 C9 86 -8 92 -20 86 C-26 83 -29 79 -27 73 Z" fill="#352720"/>
      </g>

      <path d="M17 16 C25 13 31 15 34 20 C30 27 24 30 16 27 C13 23 13 19 17 16 Z" fill="url(#mineral)" opacity=".9"/>
      <path d="M3 72 C10 68 17 69 21 74 C19 81 12 84 4 81 C1 78 1 75 3 72 Z" fill="url(#mineral)" opacity=".78"/>
    </g>
  </defs>

  <!-- transparent walking field -->
  <path d="M48 201 H952" stroke="#8f8a82" stroke-opacity=".13" stroke-width="1" stroke-dasharray="1 18"/>

  <!-- travelling ground shadow -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="80 0;840 0;840 0;80 0;80 0" keyTimes="0;.43;.50;.93;1" dur="18s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="194" rx="67" ry="9" fill="#000" opacity=".24" filter="url(#shadow)">
      <animate attributeName="rx" values="67;55;64;54;67" dur="1.28s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".24;.13;.23;.14;.24" dur="1.28s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- whole living creature -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="80 0;840 0;840 0;80 0;80 0" keyTimes="0;.43;.50;.93;1" dur="18s" repeatCount="indefinite"/>

    <g filter="url(#stoneTexture)">
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -5;0 0;0 -4;0 2" dur="1.28s" repeatCount="indefinite"/>

      <!-- rear legs -->
      <g transform="translate(-44 108) rotate(26)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="16 0 0;-13 0 0;16 0 0" dur="1.28s" repeatCount="indefinite"/>
          <g transform="scale(.82)"><use href="#limb"/></g>
        </g>
      </g>
      <g transform="translate(45 108) rotate(-24)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-13 0 0;17 0 0;-13 0 0" dur="1.28s" repeatCount="indefinite"/>
          <g transform="scale(.82)"><use href="#limb"/></g>
        </g>
      </g>

      <!-- forward weight-bearing legs -->
      <g transform="translate(-31 105) rotate(7)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-19 0 0;15 0 0;-19 0 0" dur="1.28s" begin="-.32s" repeatCount="indefinite"/>
          <g transform="scale(.92)"><use href="#limb"/></g>
        </g>
      </g>
      <g transform="translate(32 104) rotate(-8)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="18 0 0;-16 0 0;18 0 0" dur="1.28s" begin="-.32s" repeatCount="indefinite"/>
          <g transform="scale(.92)"><use href="#limb"/></g>
        </g>
      </g>

      <!-- fifth balancing limb underneath, visible between the fronts -->
      <g transform="translate(4 119) rotate(3)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="8 0 0;-10 0 0;8 0 0" dur="1.28s" begin="-.64s" repeatCount="indefinite"/>
          <g transform="scale(.67)"><use href="#limb"/></g>
        </g>
      </g>

      <!-- squat rocky torso -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-1.4 0 105;1.4 0 105;-1.4 0 105" dur="2.56s" repeatCount="indefinite"/>
        <path d="M-55 73 C-42 56 -19 48 7 49 C34 50 54 60 62 78 C69 95 65 118 52 135 C39 151 15 158 -10 154 C-34 150 -52 138 -60 119 C-68 101 -66 86 -55 73 Z"
              fill="url(#rock)" stroke="#3e2c24" stroke-width="2.5"/>

        <!-- heavy top shell seen in the references -->
        <path d="M-49 71 C-28 51 13 48 43 62 C55 68 61 78 59 87 C38 78 12 75 -14 78 C-30 80 -43 83 -58 89 C-59 82 -56 77 -49 71 Z"
              fill="#a97a59" stroke="#493329" stroke-width="2"/>
        <path d="M-40 65 C-20 57 9 57 31 64" fill="none" stroke="#d1a37c" stroke-opacity=".52" stroke-width="4" stroke-linecap="round"/>

        <!-- broad front plate -->
        <path d="M-34 82 C-16 76 16 76 35 83 C42 96 39 113 30 126 C11 133 -14 133 -33 124 C-42 110 -42 95 -34 82 Z"
              fill="url(#rockDark)" stroke="#3d2a23" stroke-width="2"/>

        <!-- cracked rock seams -->
        <path d="M-47 92 L-30 97 L-18 89 L-4 96 L10 87 L25 94 L42 88" fill="none" stroke="#493329" stroke-width="2.1" opacity=".9"/>
        <path d="M-28 124 L-18 113 L-7 119 L4 108 L16 117 L30 105" fill="none" stroke="#3e2b23" stroke-width="2" opacity=".86"/>
        <path d="M-7 52 L-2 70 L9 78" fill="none" stroke="#493329" stroke-width="2" opacity=".72"/>
        <path d="M29 58 L23 72 L31 82" fill="none" stroke="#493329" stroke-width="1.8" opacity=".72"/>
        <path d="M-39 71 L-31 84" fill="none" stroke="#493329" stroke-width="1.8" opacity=".7"/>

        <!-- mineral patches, same teal-green language as reference -->
        <path d="M-38 68 C-31 63 -23 64 -19 69 C-21 76 -28 79 -36 76 C-40 74 -41 71 -38 68 Z" fill="url(#mineral)" opacity=".88"/>
        <path d="M39 76 C46 72 53 74 56 80 C53 87 47 89 40 86 C36 83 36 79 39 76 Z" fill="url(#mineral)" opacity=".82"/>
        <path d="M-6 146 C0 142 7 143 10 147 C8 152 3 154 -4 152 C-7 150 -8 148 -6 146 Z" fill="url(#mineral)" opacity=".62"/>
      </g>
    </g>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" fill="#8b8d89" opacity=".22" letter-spacing="1.2">
    <text x="50" y="218">0</text>
    <text x="500" y="218" text-anchor="middle">x(t) · gait(t + 2πk/5)</text>
    <text x="950" y="218" text-anchor="end">1</text>
  </g>
</svg>