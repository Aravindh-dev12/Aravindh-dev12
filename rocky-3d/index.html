<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06080b">
<title>Rocky — Movie-inspired Live Eridian 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080b;color:#dbe4ea;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#stage{display:block;width:100vw;height:100vh}.hud{position:fixed;z-index:3;left:18px;top:16px;pointer-events:none;text-transform:uppercase;letter-spacing:.085em}.hud b{display:block;font-size:12px;font-weight:650}.hud span{display:block;margin-top:5px;font-size:10px;color:#7d8891}.hud .state{color:#6ce0cd}.controls{position:fixed;z-index:4;left:18px;bottom:16px;display:flex;gap:8px}.controls button{border:1px solid #26313a;background:#0a0f14;color:#8d99a4;border-radius:999px;padding:8px 11px;font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.controls button:hover,.controls button.active{border-color:#4d766f;color:#c0f8ec;background:#0c1717}.note{position:fixed;right:16px;bottom:16px;max-width:370px;text-align:right;font-size:9px;line-height:1.5;color:#58636d;letter-spacing:.035em;pointer-events:none}@media(max-width:640px){.note{display:none}.hud{left:12px;top:12px}.controls{left:12px;bottom:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud"><b>ROCKY / ERIDIAN 3D</b><span id="state" class="state">state / walking</span><span>drag = orbit · wheel = zoom</span></div>
<div class="controls"><button id="auto" class="active">auto</button><button id="walk">walk</button><button id="work">work</button></div>
<div class="note">fan-made close movie-inspired interpretation · practical-puppet anatomy reference · no official production model used</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas=document.getElementById('stage');
const stateEl=document.getElementById('state');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06080b);scene.fog=new THREE.FogExp2(0x06080b,.025);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,80);camera.position.set(6.8,3.7,8.2);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.enablePan=false;controls.target.set(0,1.65,0);controls.minDistance=4;controls.maxDistance=13;controls.maxPolarAngle=Math.PI*.495;
scene.add(new THREE.HemisphereLight(0x8ea6ba,0x201712,1.08));
const key=new THREE.DirectionalLight(0xffd6ae,4.5);key.position.set(5.5,8.5,4.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;scene.add(key);
const rim=new THREE.DirectionalLight(0x54d8cc,2.1);rim.position.set(-5,4,-5);scene.add(rim);
const fill=new THREE.PointLight(0x5e8edc,16,13,2);fill.position.set(-2,3,-4);scene.add(fill);

function makeRockTexture(){
 const c=document.createElement('canvas');c.width=c.height=384;const x=c.getContext('2d');x.fillStyle='#795237';x.fillRect(0,0,c.width,c.height);
 const im=x.getImageData(0,0,c.width,c.height);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*54;im.data[i]=Math.max(0,Math.min(255,im.data[i]+n));im.data[i+1]=Math.max(0,Math.min(255,im.data[i+1]+n*.66));im.data[i+2]=Math.max(0,Math.min(255,im.data[i+2]+n*.38));}x.putImageData(im,0,0);
 x.globalAlpha=.18;x.strokeStyle='#251914';x.lineWidth=2;for(let i=0;i<34;i++){let px=Math.random()*384,py=Math.random()*384;x.beginPath();x.moveTo(px,py);for(let j=0;j<4;j++){px+=(Math.random()-.5)*46;py+=(Math.random()-.5)*46;x.lineTo(px,py)}x.stroke()}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.15,1.15);return t;
}
const rockTex=makeRockTexture();
const shellMat=new THREE.MeshStandardMaterial({map:rockTex,color:0xa1704b,roughness:.92,metalness:.015,bumpMap:rockTex,bumpScale:.06});
const slabMat=new THREE.MeshStandardMaterial({map:rockTex,color:0x865b3d,roughness:.94,metalness:.02,bumpMap:rockTex,bumpScale:.052});
const edgeMat=new THREE.MeshStandardMaterial({map:rockTex,color:0x4e3528,roughness:.95,metalness:.015,bumpMap:rockTex,bumpScale:.04});
const membraneMat=new THREE.MeshStandardMaterial({color:0x2b211d,roughness:.68,metalness:.11});
const tendonMat=new THREE.MeshStandardMaterial({color:0x263a34,roughness:.62,metalness:.02});
const mineralMat=new THREE.MeshStandardMaterial({color:0x2cb7a4,emissive:0x0f6e64,emissiveIntensity:1.65,roughness:.28,metalness:.06});
const consoleMat=new THREE.MeshStandardMaterial({color:0x0d151a,roughness:.38,metalness:.44});
const holoMat=new THREE.MeshBasicMaterial({color:0x5ce7d6,transparent:true,opacity:.42,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});

const floor=new THREE.Mesh(new THREE.PlaneGeometry(28,28),new THREE.MeshStandardMaterial({color:0x090d11,roughness:.86,metalness:.03}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const floorRing=new THREE.Mesh(new THREE.RingGeometry(2.8,3.0,96),new THREE.MeshBasicMaterial({color:0x173038,transparent:true,opacity:.28,side:THREE.DoubleSide}));floorRing.rotation.x=-Math.PI/2;floorRing.position.y=.008;scene.add(floorRing);

const consoleRig=new THREE.Group();consoleRig.position.set(3.0,0,.05);scene.add(consoleRig);
const base=new THREE.Mesh(new THREE.CylinderGeometry(.54,.75,.26,28),consoleMat);base.position.y=.13;base.castShadow=base.receiveShadow=true;consoleRig.add(base);
const stem=new THREE.Mesh(new THREE.CylinderGeometry(.16,.25,1.08,20),consoleMat);stem.position.y=.78;stem.rotation.z=-.07;stem.castShadow=true;consoleRig.add(stem);
const panel=new THREE.Mesh(new THREE.BoxGeometry(1.02,.72,.12),consoleMat);panel.position.set(-.08,1.42,0);panel.rotation.z=-.15;panel.castShadow=true;consoleRig.add(panel);
const holo=new THREE.Mesh(new THREE.PlaneGeometry(.78,.46),holoMat);holo.position.set(-.14,1.43,-.067);holo.rotation.y=Math.PI;holo.rotation.z=-.15;consoleRig.add(holo);
for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.PlaneGeometry(.52,.012),holoMat.clone());l.material.opacity=.18+i*.035;l.position.set(-.16,1.29+i*.075,-.071);l.rotation.y=Math.PI;l.rotation.z=-.15;consoleRig.add(l)}

function carapaceGeometry(scale=.0){
 const s=new THREE.Shape();s.moveTo(-.58,-1.0);s.bezierCurveTo(-.88,-.82,-.98,-.28,-.88,.25);s.bezierCurveTo(-.8,.75,-.45,1.02,-.05,1.08);s.bezierCurveTo(.43,1.08,.8,.72,.9,.22);s.bezierCurveTo(1.0,-.32,.79,-.83,.48,-1.03);s.bezierCurveTo(.14,-1.16,-.24,-1.13,-.58,-1.0);
 const g=new THREE.ExtrudeGeometry(s,{depth:.62,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.1+scale,bevelThickness:.1+scale,curveSegments:16});g.center();return g;
}
const creature=new THREE.Group();creature.position.set(-.35,0,0);scene.add(creature);
const body=new THREE.Mesh(carapaceGeometry(),shellMat);body.position.set(0,2.18,0);body.scale.set(1.05,1.0,1.05);body.castShadow=body.receiveShadow=true;creature.add(body);
const frontPlate=new THREE.Mesh(carapaceGeometry(-.025),shellMat.clone());frontPlate.material.color.setHex(0x9b6845);frontPlate.position.set(.02,2.2,.39);frontPlate.scale.set(.92,.91,.22);frontPlate.castShadow=true;creature.add(frontPlate);
const rearPlate=new THREE.Mesh(carapaceGeometry(-.02),edgeMat);rearPlate.position.set(-.03,2.16,-.39);rearPlate.scale.set(.94,.92,.2);rearPlate.castShadow=true;creature.add(rearPlate);

function addCrack(points){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],p[1],.735+p[2])));const m=new THREE.Mesh(new THREE.TubeGeometry(curve,18,.012,5,false),new THREE.MeshStandardMaterial({color:0x2d2019,roughness:1}));m.castShadow=true;creature.add(m)}
addCrack([[-.48,2.7,0],[-.28,2.52,.01],[-.08,2.59,0],[.12,2.42,.01]]);addCrack([[.27,2.89,0],[.18,2.68,.01],[.34,2.53,0],[.22,2.3,.01]]);addCrack([[-.42,2.08,0],[-.18,2.03,.01],[-.04,1.82,0]]);addCrack([[.07,1.73,0],[.25,1.9,.01],[.46,1.82,0]]);

const mineralPatches=[[-.64,2.62,.76,.18,.11],[.58,2.33,.75,.13,.08],[-.38,1.75,.74,.11,.065]];
for(const [x,y,z,rx,ry] of mineralPatches){const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,12),mineralMat);m.position.set(x,y,z);m.scale.set(rx,ry,.055);m.castShadow=true;creature.add(m)}

function slabMesh(top=.28,bottom=.34){const m=new THREE.Mesh(new THREE.CylinderGeometry(top,bottom,1,8,1,false),slabMat.clone());m.scale.z=.62;m.castShadow=m.receiveShadow=true;return m}
function alignBetween(mesh,a,b){const d=b.clone().sub(a);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());mesh.scale.y=d.length();}
function makeRibbedJoint(parent,count=4){const g=new THREE.Group();parent.add(g);const rings=[];for(let i=0;i<count;i++){const r=new THREE.Mesh(new THREE.CylinderGeometry(.29-i*.014,.29-i*.014,.08,12),membraneMat);r.position.y=(i-(count-1)/2)*.085;r.scale.z=.7;r.castShadow=true;g.add(r);rings.push(r)}return{g,rings}}
function makeHand(parent){const g=new THREE.Group();parent.add(g);const palm=new THREE.Mesh(new THREE.CylinderGeometry(.25,.29,.35,7),edgeMat);palm.rotation.z=Math.PI/2;palm.scale.z=.72;palm.castShadow=true;g.add(palm);const fingers=[];for(let j=-1;j<=1;j++){const f=new THREE.Mesh(new THREE.CylinderGeometry(.07,.095,.44,7),slabMat);f.rotation.z=-Math.PI/2;f.rotation.y=j*.46;f.position.set(.30,0,j*.12);f.castShadow=true;g.add(f);fingers.push(f)}return{g,fingers}}

const limbs=[];const azimuths=[0,Math.PI*2/5,Math.PI*4/5,Math.PI*6/5,Math.PI*8/5];
for(let i=0;i<5;i++){
 const root=new THREE.Group();root.rotation.y=azimuths[i];creature.add(root);
 const socket=new THREE.Mesh(new THREE.CylinderGeometry(.34,.39,.23,12),tendonMat);socket.rotation.z=Math.PI/2;socket.position.set(.82,2.18,0);socket.scale.z=.75;socket.castShadow=true;root.add(socket);
 const green=new THREE.Mesh(new THREE.CylinderGeometry(.27,.3,.12,12),mineralMat);green.rotation.z=Math.PI/2;green.position.set(.94,2.18,0);green.scale.z=.72;root.add(green);
 const upper=slabMesh(.24,.31),lower=slabMesh(.22,.29);root.add(upper,lower);
 const elbow=makeRibbedJoint(root,5);const wrist=makeRibbedJoint(root,4);const hand=makeHand(root);
 limbs.push({root,socket,green,upper,lower,elbow,wrist,hand,index:i,phase:i/5});
}

function solveLimb(L,target,bendSign=1){
 const S=new THREE.Vector3(1.02,2.18,0);const len1=1.12,len2=1.18;const T=target.clone();const dx=T.x-S.x,dy=T.y-S.y;const dist=Math.max(.28,Math.min(len1+len2-.035,Math.hypot(dx,dy)));const ux=dx/dist,uy=dy/dist;const a=(len1*len1-len2*len2+dist*dist)/(2*dist);const h=Math.sqrt(Math.max(0,len1*len1-a*a));const E=new THREE.Vector3(S.x+ux*a-uy*h*bendSign,S.y+uy*a+ux*h*bendSign,0);
 const s1=S.clone().lerp(E,.13),e1=S.clone().lerp(E,.88),s2=E.clone().lerp(T,.13),e2=E.clone().lerp(T,.83);alignBetween(L.upper,s1,e1);alignBetween(L.lower,s2,e2);L.elbow.g.position.copy(E);L.wrist.g.position.copy(E.clone().lerp(T,.91));L.hand.g.position.copy(T);L.hand.g.rotation.z=-.08;
}

function gaitTarget(L,t){
 const p=(t*.62+L.phase)%1,stance=.7;let radial=2.05,height=.16;if(p<stance){const q=p/stance;radial=2.18+THREE.MathUtils.lerp(.28,-.24,q)}else{const q=(p-stance)/(1-stance);radial=2.18+THREE.MathUtils.lerp(-.24,.28,q);height=.16+Math.sin(Math.PI*q)*.38}return new THREE.Vector3(radial,height,0);
}
function plantedTarget(L,t){return new THREE.Vector3(2.04+Math.sin(t*.55+L.index*.8)*.025,.16,0)}
function workTarget(L,t){if(L.index===0)return new THREE.Vector3(2.25,1.36+Math.sin(t*3.1)*.10,0);if(L.index===4)return new THREE.Vector3(1.92,.28+Math.sin(t*1.2)*.035,0);return plantedTarget(L,t)}
let mode='auto',lastLabel='';const setActive=id=>{for(const x of ['auto','walk','work'])document.getElementById(x).classList.toggle('active',x===id)};for(const id of ['auto','walk','work'])document.getElementById(id).onclick=()=>{mode=id;setActive(id)};
const clock=new THREE.Clock();function smooth(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
function animate(){
 requestAnimationFrame(animate);const t=clock.getElapsedTime(),cycle=t%19;const isWorking=mode==='work'||(mode==='auto'&&cycle>10.5&&cycle<16);const mix=mode==='auto'?(isWorking?Math.min(smooth(10,11,cycle),1-smooth(15.4,16.2,cycle)):0):(isWorking?1:0);const label=isWorking?'working':'walking';if(label!==lastLabel){lastLabel=label;stateEl.textContent=`state / ${label}`}
 let sx=0,sz=0,n=0;
 for(const L of limbs){let target=gaitTarget(L,t);if(isWorking)target.lerp(workTarget(L,t),Math.max(.2,mix));const bend=(L.index===0||L.index===1)?1:-1;solveLimb(L,target,bend);const p=(t*.62+L.phase)%1;if(p<.7||isWorking){const a=L.root.rotation.y;sx+=Math.cos(a)*target.x;sz+=Math.sin(a)*target.x;n++}if(L.index===0&&isWorking){L.hand.fingers[0].rotation.y=-.2+Math.sin(t*4)*.12;L.hand.fingers[1].rotation.y=Math.sin(t*3.4)*.12;L.hand.fingers[2].rotation.y=.2+Math.sin(t*3.8+1)*.12}}
 if(n){sx/=n;sz/=n}creature.position.x=-.35-sx*.018;creature.position.z=-sz*.018;creature.position.y=.025+Math.sin(t*1.24)*.014;creature.rotation.z=Math.sin(t*.62)*.012;creature.rotation.x=Math.sin(t*.43)*.008;
 body.rotation.y=Math.sin(t*.31)*.012;frontPlate.rotation.y=body.rotation.y;rearPlate.rotation.y=body.rotation.y;holo.material.opacity=.36+Math.sin(t*2.2)*.08;consoleRig.rotation.y=Math.sin(t*.18)*.018;controls.update();renderer.render(scene,camera);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});animate();
</script>
</body>
</html>
