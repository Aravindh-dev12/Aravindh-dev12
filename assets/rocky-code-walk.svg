<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Code-drawn walking Rocky</title>
  <desc id="desc">A five-limbed sandstone character drawn entirely with SVG geometry and animated with declarative SVG transforms.</desc>

  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8a386"/>
      <stop offset="0.48" stop-color="#a98a70"/>
      <stop offset="1" stop-color="#765b49"/>
    </linearGradient>
    <linearGradient id="stoneLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2b092"/>
      <stop offset="1" stop-color="#9a785f"/>
    </linearGradient>
    <radialGradient id="mineral">
      <stop offset="0" stop-color="#b9ffe2"/>
      <stop offset="0.35" stop-color="#76d9b3"/>
      <stop offset="1" stop-color="#3f9d75"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <g id="limb">
      <ellipse cx="0" cy="25" rx="23" ry="34" fill="url(#stoneLight)" stroke="#5b4638" stroke-width="3"/>
      <path d="M-8 8 L6 23 L-5 36" fill="none" stroke="#604a3b" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>
      <circle cx="0" cy="55" r="14" fill="#4f3e33"/>
      <ellipse cx="0" cy="86" rx="19" ry="34" fill="url(#stone)" stroke="#5b4638" stroke-width="3"/>
      <path d="M-7 70 L7 88 L-3 104" fill="none" stroke="#604a3b" stroke-width="2.3" stroke-linecap="round" opacity=".7"/>
      <circle cx="5" cy="76" r="6" fill="url(#mineral)" filter="url(#glow)"/>
      <g transform="translate(0 118)">
        <ellipse cx="-12" cy="8" rx="9" ry="21" transform="rotate(24 -12 8)" fill="url(#stoneLight)" stroke="#5b4638" stroke-width="2"/>
        <ellipse cx="0" cy="5" rx="9" ry="22" fill="url(#stoneLight)" stroke="#5b4638" stroke-width="2"/>
        <ellipse cx="12" cy="8" rx="9" ry="21" transform="rotate(-24 12 8)" fill="url(#stoneLight)" stroke="#5b4638" stroke-width="2"/>
      </g>
    </g>
  </defs>

  <ellipse cx="320" cy="319" rx="126" ry="18" fill="#000" opacity=".16" filter="url(#shadow)">
    <animate attributeName="rx" values="118;130;118" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".12;.2;.12" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>

  <g id="rocky">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0;0 -3;0 0" dur="1.4s" repeatCount="indefinite"/>

    <!-- back-left limb -->
    <g transform="translate(254 177) rotate(52)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-15;16;-15" dur="1.4s" begin="-.35s" repeatCount="indefinite"/>
        <use href="#limb"/>
      </g>
    </g>

    <!-- back-right limb -->
    <g transform="translate(386 180) rotate(-52)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="16;-15;16" dur="1.4s" begin="-.7s" repeatCount="indefinite"/>
        <use href="#limb"/>
      </g>
    </g>

    <!-- body shell -->
    <path d="M245 139 Q272 91 322 88 Q380 88 405 137 Q424 174 397 212 Q373 241 320 242 Q267 242 242 211 Q219 176 245 139Z" fill="url(#stone)" stroke="#554237" stroke-width="4"/>
    <path d="M260 132 Q284 101 321 99 Q360 99 389 130 L379 157 Q346 146 320 147 Q286 147 254 161Z" fill="#b99477" opacity=".82" stroke="#604a3b" stroke-width="2.5"/>
    <path d="M265 173 Q298 153 333 159 Q364 164 392 188 Q378 225 322 231 Q278 228 249 201Z" fill="#9f7e65" opacity=".66"/>

    <!-- chest plate -->
    <path d="M284 181 Q320 164 356 181 L349 237 Q336 267 320 279 Q302 267 290 237Z" fill="url(#stoneLight)" stroke="#594538" stroke-width="3"/>

    <!-- cracks -->
    <g fill="none" stroke="#4d3c31" stroke-width="3" stroke-linecap="round" opacity=".78">
      <path d="M278 119 l18 13 -9 15 18 11"/>
      <path d="M356 111 l-13 18 13 13 -8 18"/>
      <path d="M258 181 l19 7 -8 15 18 7"/>
      <path d="M371 181 l-16 9 8 17 -15 9"/>
      <path d="M305 205 l13 10 -9 16 13 9"/>
    </g>

    <!-- mineral patches -->
    <g filter="url(#glow)">
      <circle cx="282" cy="126" r="9" fill="url(#mineral)"/>
      <circle cx="374" cy="157" r="8" fill="url(#mineral)"/>
      <circle cx="315" cy="195" r="7" fill="url(#mineral)"/>
      <circle cx="337" cy="113" r="6" fill="url(#mineral)"/>
    </g>

    <!-- front-left limb -->
    <g transform="translate(274 193) rotate(28)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="13;-17;13" dur="1.4s" repeatCount="indefinite"/>
        <use href="#limb"/>
      </g>
    </g>

    <!-- front-right limb -->
    <g transform="translate(367 193) rotate(-28)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-17;13;-17" dur="1.4s" begin="-.7s" repeatCount="indefinite"/>
        <use href="#limb"/>
      </g>
    </g>

    <!-- center limb -->
    <g transform="translate(320 219)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-9;11;-9" dur="1.4s" begin="-.35s" repeatCount="indefinite"/>
        <use href="#limb"/>
      </g>
    </g>
  </g>
</svg>