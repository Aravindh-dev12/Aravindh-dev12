<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rocky — Real 3D Model</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#07090d;color:#d7dde5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  #stage{width:100vw;height:100vh;display:block}
  .hud{position:fixed;left:18px;bottom:16px;font-size:12px;line-height:1.6;letter-spacing:.08em;color:#8d98a6;pointer-events:none;text-transform:uppercase}
  .hud b{color:#d8e0e8;font-weight:600}
  .status{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .35s ease;color:#cbd5df;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .status.hidden{opacity:0}
  .credit{position:fixed;right:16px;bottom:14px;font-size:10px;color:#67717d;letter-spacing:.05em}
  .credit a{color:#8793a0;text-decoration:none}
  .credit a:hover{color:#b9c3cd}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="status" class="status">Loading real Rocky model…</div>
<div class="hud"><b>ROCKY / PHOTOREAL 3D</b><br>drag = orbit · wheel = zoom</div>
<div class="credit">3D asset: <a href="https://polyhaven.com/a/boulder_01" target="_blank" rel="noreferrer">Poly Haven · Boulder 01 · CC0</a></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const canvas=document.getElementById('stage');
const statusEl=document.getElementById('status');

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07090d);
scene.fog=new THREE.FogExp2(0x07090d,.028);

const camera=new THREE.PerspectiveCamera(40,1,.05,100);
camera.position.set(4.7,3.2,6.6);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.enablePan=false;
controls.target.set(0,1.1,0);
controls.minDistance=2.7;
controls.maxDistance=13;
controls.maxPolarAngle=Math.PI*.49;

scene.add(new THREE.HemisphereLight(0x89a7c7,0x201914,1.15));

const key=new THREE.DirectionalLight(0xffdfbd,4.6);
key.position.set(4.5,7.5,4.5);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-5;
key.shadow.camera.right=5;
key.shadow.camera.top=5;
key.shadow.camera.bottom=-5;
scene.add(key);

const rim=new THREE.DirectionalLight(0x54d6cd,2.25);
rim.position.set(-5,4,-4);
scene.add(rim);

const coolFill=new THREE.PointLight(0x4c92ff,18,12,2);
coolFill.position.set(0,2.4,-3.2);
scene.add(coolFill);

const floor=new THREE.Mesh(
  new THREE.CircleGeometry(7.5,96),
  new THREE.MeshStandardMaterial({color:0x0a0e13,roughness:.8,metalness:.04})
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const pedestal=new THREE.Mesh(
  new THREE.CylinderGeometry(1.8,2.05,.16,72),
  new THREE.MeshStandardMaterial({color:0x10161d,roughness:.52,metalness:.18})
);
pedestal.position.y=.08;
pedestal.receiveShadow=true;
pedestal.castShadow=true;
scene.add(pedestal);

const rockyRoot=new THREE.Group();
scene.add(rockyRoot);
let rocky=null;

function collectUrls(node,out=[]){
  if(!node) return out;
  if(typeof node==='string'){
    if(/^https?:\/\//i.test(node)) out.push(node);
    return out;
  }
  if(Array.isArray(node)){
    for(const item of node) collectUrls(item,out);
    return out;
  }
  if(typeof node==='object'){
    for(const value of Object.values(node)) collectUrls(value,out);
  }
  return out;
}

function chooseModelUrl(files){
  const urls=collectUrls(files);
  const modelUrls=urls.filter(url=>/\.(glb|gltf)(\?|$)/i.test(url));
  return (
    modelUrls.find(url=>/1k/i.test(url)&&/\.gltf(\?|$)/i.test(url)) ||
    modelUrls.find(url=>/1k/i.test(url)&&/\.glb(\?|$)/i.test(url)) ||
    modelUrls.find(url=>/\.gltf(\?|$)/i.test(url)) ||
    modelUrls.find(url=>/\.glb(\?|$)/i.test(url)) ||
    null
  );
}

function fitRocky(model){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const targetHeight=2.65;
  const scale=targetHeight/Math.max(size.y,.001);
  model.scale.setScalar(scale);
  model.updateMatrixWorld(true);

  const scaledBox=new THREE.Box3().setFromObject(model);
  const scaledCenter=scaledBox.getCenter(new THREE.Vector3());
  model.position.x-=scaledCenter.x;
  model.position.z-=scaledCenter.z;
  model.position.y-=scaledBox.min.y;
  model.position.y+=.17;
  model.updateMatrixWorld(true);

  const finalBox=new THREE.Box3().setFromObject(model);
  const finalCenter=finalBox.getCenter(new THREE.Vector3());
  controls.target.copy(finalCenter);
  controls.target.y*=.92;
  camera.position.set(finalCenter.x+4.5,finalCenter.y+2.2,finalCenter.z+6.1);
  controls.update();
}

async function loadRocky(){
  try{
    const response=await fetch('https://api.polyhaven.com/files/boulder_01');
    if(!response.ok) throw new Error(`Poly Haven API ${response.status}`);
    const files=await response.json();
    const modelUrl=chooseModelUrl(files);
    if(!modelUrl) throw new Error('No glTF model URL found');

    const loader=new GLTFLoader();
    const gltf=await loader.loadAsync(modelUrl);
    rocky=gltf.scene;
    rocky.name='RockyRealBoulder';

    rocky.traverse(obj=>{
      if(!obj.isMesh) return;
      obj.castShadow=true;
      obj.receiveShadow=true;
      if(obj.material){
        obj.material.envMapIntensity=.65;
        obj.material.needsUpdate=true;
      }
    });

    rockyRoot.add(rocky);
    fitRocky(rocky);
    await renderer.compileAsync(rockyRoot,camera,scene);
    statusEl.classList.add('hidden');
  }catch(error){
    console.error(error);
    statusEl.textContent='Rocky model could not load — check network/CORS';
  }
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  if(rocky){
    rockyRoot.rotation.y=Math.sin(t*.34)*.18;
    rockyRoot.position.y=Math.sin(t*.9)*.015;
  }
  pedestal.rotation.y=t*.035;
  controls.update();
  renderer.render(scene,camera);
}

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}

addEventListener('resize',resize);
resize();
loadRocky();
animate();
</script>
</body>
</html>
