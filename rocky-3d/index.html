#stage{display:block;width:100vw;height:100vh}.hud{position:fixed;z-index:3;left:18px;top:16px;pointer-events:none;text-transform:uppercase;letter-spacing:.08em}.hud b{display:block;font-size:12px;color:#e3e8ea;font-weight:650}.hud span{display:block;margin-top:5px;font-size:10px;color:#7f8b96}.state{color:#74e4d2!important}.controls{position:fixed;z-index:4;left:18px;bottom:16px;display:flex;gap:8px}button{appearance:none;border:1px solid #29333b;background:#0a1015;color:#8997a1;font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;padding:8px 11px;border-radius:999px;cursor:pointer;text-transform:uppercase}button:hover,button.active{border-color:#47746f;color:#c1f7ed;background:#0d1919}.loading{position:fixed;z-index:2;inset:0;display:grid;place-items:center;pointer-events:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#87949e;transition:opacity .35s}.loading.hidden{opacity:0}.note{position:fixed;z-index:3;right:16px;bottom:16px;max-width:420px;text-align:right;font-size:9px;line-height:1.5;color:#59646d;letter-spacing:.035em;pointer-events:none}.note a{color:#75848f;pointer-events:auto}@media(max-width:650px){.note{display:none}.hud{left:12px;top:12px}.controls{left:12px;bottom:12px}}

<body>
<canvas id="stage"></canvas><div id="loading" class="loading">loading official Rocky geometry…</div>
<div class="hud"><b>ROCKY / MOVIE GEOMETRY</b><span id="state" class="state">state / loading</span><span>drag = orbit · wheel = zoom</span></div>
<div class="controls"><button id="auto" class="active">auto</button><button id="walk">walk</button><button id="work">work</button><button id="still">still</button></div>
<div class="note">official Project Hail Mary Rocky self-print geometry loaded at runtime · CC Attribution source mirror: <a href="https://sketchfab.com/3d-models/rocky-project-hail-mary-d2b56242f7e048cfbdd08ca897aec966" target="_blank" rel="noreferrer">William Croft / official campaign model</a></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const ZIP_URL='https://d95a3luo0amge.cloudfront.net/826ddd7c-aa66-4d0e-86ec-2dc212430cdd/projecthailmary/images/project_hail_mary_self_print_rocky.zip',STL_PATH='statue_unsupported/statue_unsupported.stl';
const canvas=document.getElementById('stage'),loadingEl=document.getElementById('loading'),stateEl=document.getElementById('state');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07090d);scene.fog=new THREE.FogExp2(0x07090d,.022);const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.05,80);camera.position.set(6.8,4.2,7.6);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.enablePan=false;controls.target.set(0,1.45,0);controls.minDistance=3.2;controls.maxDistance=14;controls.maxPolarAngle=Math.PI*.495;
scene.add(new THREE.HemisphereLight(0x889fb4,0x211914,1));const key=new THREE.DirectionalLight(0xffd6b2,4.7);key.position.set(5.5,8,4.7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;scene.add(key);const rim=new THREE.DirectionalLight(0x51d9cd,2.25);rim.position.set(-5,4,-5);scene.add(rim);const cool=new THREE.PointLight(0x4c87ff,18,13,2);cool.position.set(-2.5,3,-3.5);scene.add(cool);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(28,28),new THREE.MeshStandardMaterial({color:0x090d11,roughness:.86,metalness:.03}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const halo=new THREE.Mesh(new THREE.RingGeometry(2.4,2.46,96),new THREE.MeshBasicMaterial({color:0x21434a,transparent:true,opacity:.35,side:THREE.DoubleSide}));halo.rotation.x=-Math.PI/2;halo.position.y=.007;scene.add(halo);
const consoleRig=new THREE.Group();consoleRig.position.set(2.9,0,0);scene.add(consoleRig);const consoleMat=new THREE.MeshStandardMaterial({color:0x10171d,roughness:.36,metalness:.5});const base=new THREE.Mesh(new THREE.CylinderGeometry(.52,.72,.25,28),consoleMat);base.position.y=.125;base.castShadow=base.receiveShadow=true;consoleRig.add(base);const stem=new THREE.Mesh(new THREE.CylinderGeometry(.15,.24,1.05,20),consoleMat);stem.position.y=.75;stem.rotation.z=-.08;stem.castShadow=true;consoleRig.add(stem);const panel=new THREE.Mesh(new THREE.BoxGeometry(.92,.62,.09),consoleMat);panel.position.set(-.08,1.34,0);panel.rotation.z=-.16;panel.castShadow=true;consoleRig.add(panel);const screenMat=new THREE.MeshBasicMaterial({color:0x54e5d2,transparent:true,opacity:.42,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});const screen=new THREE.Mesh(new THREE.PlaneGeometry(.68,.36),screenMat);screen.position.set(-.12,1.34,-.051);screen.rotation.y=Math.PI;screen.rotation.z=-.16;consoleRig.add(screen);
const root=new THREE.Group();root.position.set(-.25,0,0);scene.add(root);let rocky=null,shader=null,mode='auto',currentState='loading';const setActive=id=>{for(const k of ['auto','walk','work','still'])document.getElementById(k).classList.toggle('active',k===id)};for(const id of ['auto','walk','work','still'])document.getElementById(id).onclick=()=>{mode=id;setActive(id)};
function makeRockMaterial(){const mat=new THREE.MeshPhysicalMaterial({color:0x5c4638,roughness:.92,metalness:.015,clearcoat:.025,clearcoatRoughness:.92,sheen:.07,sheenColor:new THREE.Color(0x7a5a45)});mat.onBeforeCompile=s=>{shader=s;s.uniforms.uTime={value:0};s.uniforms.uWalk={value:0};s.uniforms.uWork={value:0};s.uniforms.uScaleHint={value:1};s.vertexShader=s.vertexShader.replace('#include <common>',`#include <common>\nuniform float uTime;uniform float uWalk;uniform float uWork;uniform float uScaleHint;const float TAU=6.28318530718;`).replace('#include <begin_vertex>',`#include <begin_vertex>\nfloat rr=length(transformed.xz);float limbMask=smoothstep(0.82*uScaleHint,1.85*uScaleHint,rr);float ang=atan(transformed.z,transformed.x);float sector=floor((ang+3.14159265)/TAU*5.0+0.5);float phase=sector*(TAU/5.0);float gait=sin(uTime*2.2+phase);float lift=max(gait,0.0);float push=sin(uTime*2.2+phase-1.1);vec2 radial=normalize(transformed.xz+vec2(0.0001));vec2 tangent=vec2(-radial.y,radial.x);transformed.y+=uWalk*limbMask*lift*.16*uScaleHint;transformed.xz+=uWalk*limbMask*tangent*push*.055*uScaleHint;transformed.xz+=uWalk*limbMask*radial*(-lift*.025*uScaleHint);float front=max(0.0,cos(ang));float workMask=limbMask*smoothstep(.55,.95,front);transformed.y+=uWork*workMask*(.34+.045*sin(uTime*3.1))*uScaleHint;transformed.x+=uWork*workMask*.14*uScaleHint;`)};mat.customProgramCacheKey=()=> 'rocky-official-deform-v2';return mat}
function normalizeGeometry(g){g.computeVertexNormals();g.rotateX(-Math.PI/2);g.computeBoundingBox();let box=g.boundingBox,size=box.getSize(new THREE.Vector3());if(size.y<Math.max(size.x,size.z)*.22){g.rotateX(Math.PI/2);g.rotateZ(Math.PI/2);g.computeBoundingBox();box=g.boundingBox;size=box.getSize(new THREE.Vector3())}const center=box.getCenter(new THREE.Vector3());g.translate(-center.x,-box.min.y,-center.z);g.computeBoundingBox();const finalSize=g.boundingBox.getSize(new THREE.Vector3()),maxSpan=Math.max(finalSize.x,finalSize.y,finalSize.z),scale=4.25/Math.max(maxSpan,.001);g.scale(scale,scale,scale);g.computeBoundingBox();g.computeBoundingSphere();const b=g.boundingBox,c=b.getCenter(new THREE.Vector3());g.translate(-c.x,-b.min.y,-c.z);g.computeBoundingBox()}
async function loadOfficialRocky(){try{stateEl.textContent='state / downloading official mesh';const response=await fetch(ZIP_URL,{mode:'cors',cache:'force-cache'});if(!response.ok)throw new Error(`official model download failed: ${response.status}`);const bytes=await response.arrayBuffer();stateEl.textContent='state / extracting model';const archive=await window.JSZip.loadAsync(bytes),entry=archive.file(STL_PATH);if(!entry)throw new Error(`missing ${STL_PATH}`);const stlBytes=await entry.async('arraybuffer');stateEl.textContent='state / building geometry';const geometry=new STLLoader().parse(stlBytes);normalizeGeometry(geometry);rocky=new THREE.Mesh(geometry,makeRockMaterial());rocky.castShadow=true;rocky.receiveShadow=true;rocky.rotation.y=-.34;root.add(rocky);const box=new THREE.Box3().setFromObject(rocky),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());controls.target.set(center.x,Math.max(.8,center.y*.92),center.z);camera.position.set(center.x+size.x*1.15,center.y+size.y*.66,center.z+size.z*1.5);controls.update();loadingEl.classList.add('hidden');currentState=''}catch(err){console.error(err);stateEl.textContent='state / official model blocked';loadingEl.textContent='official Rocky model could not load — open console for network/CORS details'}}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();let targetWalk=0,targetWork=0,label='still';if(mode==='walk'){targetWalk=1;label='walking'}else if(mode==='work'){targetWork=1;label='working'}else if(mode==='still'){label='still'}else{const p=t%18;if(p<9.5){targetWalk=1;label='walking'}else if(p<15){targetWork=1;label='working'}else label='observing'}if(shader){shader.uniforms.uTime.value=t;shader.uniforms.uWalk.value=THREE.MathUtils.lerp(shader.uniforms.uWalk.value,targetWalk,.075);shader.uniforms.uWork.value=THREE.MathUtils.lerp(shader.uniforms.uWork.value,targetWork,.075);const bs=rocky.geometry.boundingSphere?.radius||2;shader.uniforms.uScaleHint.value=Math.max(.45,bs*.56)}if(rocky){const w=shader?.uniforms.uWalk.value||0,k=shader?.uniforms.uWork.value||0;root.position.y=.02+w*(.025+Math.sin(t*4.4)*.018);root.rotation.z=w*Math.sin(t*2.2)*.018-k*.045;root.rotation.x=k*.035;root.position.x=-.25+k*.14;root.rotation.y=-.34+k*.10+Math.sin(t*.5)*.012;if(label!==currentState){currentState=label;stateEl.textContent=`state / ${label}`}}screen.material.opacity=.36+Math.sin(t*2.4)*.08;controls.update();renderer.render(scene,camera)}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});loadOfficialRocky();animate();
</script>
