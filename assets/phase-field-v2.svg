<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-label="ARAVINDHAN / PHASE.FIELD animated mathematical field">
<defs>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#e6edf3"/>
    <stop offset="0.34" stop-color="#58a6ff"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10Z" fill="#58a6ff" opacity=".75"/>
  </marker>
</defs>
<style>
  :root{--fg:#e6edf3;--muted:#a8b3bf;--faint:#3a434d;--accent:#58a6ff;--accent2:#bc8cff;--hot:#3fb950;--panel:#0d1117}
  .bg{fill:var(--panel)}
  .fg{fill:var(--fg)}
  .muted{fill:var(--muted)}
  .title{font:700 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.07em}
  .label{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
  .small{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .body{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .divider{stroke:var(--faint);stroke-width:1.2}
  @media(prefers-color-scheme:light){:root{--fg:#24292f;--muted:#57606a;--faint:#c9d1d9;--accent:#0969da;--accent2:#8250df;--hot:#1a7f37;--panel:#fff}}
</style>

<rect class="bg" width="1200" height="410" rx="18"/>
<text x="48" y="50" class="fg title">ARAVINDHAN / PHASE.FIELD</text>
<text x="48" y="80" class="muted small">motion · interference · attractors · vector flow</text>
<line x1="48" y1="104" x2="1152" y2="104" class="divider"/>
<text x="48" y="137" class="muted label">02 / DYNAMIC PHASE FIELD</text>

<!-- vector field -->
<g stroke="var(--accent)" stroke-width="1.2" opacity=".34" marker-end="url(#arrow)">
  <path d="M70 172l34 6"><animateTransform attributeName="transform" type="rotate" values="-8 70 172;8 70 172;-8 70 172" dur="4.2s" repeatCount="indefinite"/></path>
  <path d="M158 205l34 -5"><animateTransform attributeName="transform" type="rotate" values="10 158 205;-12 158 205;10 158 205" dur="5s" repeatCount="indefinite"/></path>
  <path d="M248 164l34 9"><animateTransform attributeName="transform" type="rotate" values="-12 248 164;10 248 164;-12 248 164" dur="5.5s" repeatCount="indefinite"/></path>
  <path d="M918 172l34 -8"><animateTransform attributeName="transform" type="rotate" values="12 918 172;-9 918 172;12 918 172" dur="4.7s" repeatCount="indefinite"/></path>
  <path d="M1010 206l34 5"><animateTransform attributeName="transform" type="rotate" values="-8 1010 206;12 1010 206;-8 1010 206" dur="5.6s" repeatCount="indefinite"/></path>
  <path d="M1090 168l34 7"><animateTransform attributeName="transform" type="rotate" values="9 1090 168;-11 1090 168;9 1090 168" dur="4.3s" repeatCount="indefinite"/></path>
</g>

<!-- interference waves -->
<g fill="none" stroke-width="1.5">
  <path stroke="var(--accent)" opacity=".65" d="M58 258 C150 184 242 330 334 258 S518 184 610 258 S794 330 886 258 S1070 184 1142 258">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M58 258 C150 184 242 330 334 258 S518 184 610 258 S794 330 886 258 S1070 184 1142 258;M58 258 C150 330 242 184 334 258 S518 330 610 258 S794 184 886 258 S1070 330 1142 258;M58 258 C150 184 242 330 334 258 S518 184 610 258 S794 330 886 258 S1070 184 1142 258"/>
  </path>
  <path stroke="var(--accent2)" opacity=".48" d="M58 268 C150 320 242 210 334 268 S518 320 610 268 S794 210 886 268 S1070 320 1142 268">
    <animate attributeName="d" dur="5.6s" repeatCount="indefinite" values="M58 268 C150 320 242 210 334 268 S518 320 610 268 S794 210 886 268 S1070 320 1142 268;M58 268 C150 210 242 320 334 268 S518 210 610 268 S794 320 886 268 S1070 210 1142 268;M58 268 C150 320 242 210 334 268 S518 320 610 268 S794 210 886 268 S1070 320 1142 268"/>
  </path>
</g>

<!-- attractor -->
<g transform="translate(610 236)">
  <ellipse rx="190" ry="70" fill="none" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="5 10" opacity=".9">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="142" ry="100" fill="none" stroke="var(--accent2)" stroke-width="1.3" stroke-dasharray="8 12" opacity=".58">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="94" ry="128" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 9" opacity=".56">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M-168 4 C-125 -92 -45 -118 0 -18 C45 -118 125 -92 168 4 C120 86 48 104 0 18 C-48 104 -120 86 -168 4Z" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".58" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle r="29" fill="url(#core)" filter="url(#glow)">
    <animate attributeName="r" values="24;35;24" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="9" fill="var(--fg)"/>
  <circle r="40" fill="none" stroke="var(--accent)" opacity=".35">
    <animate attributeName="r" values="34;64;34" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;.05;.55" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- moving particles -->
<g filter="url(#glow)">
  <circle r="5" fill="var(--hot)"><animateMotion dur="8s" repeatCount="indefinite" path="M108 224 C260 110 450 338 610 236 S948 108 1092 224"/></circle>
  <circle r="4" fill="var(--accent)"><animateMotion dur="8s" begin="-2.7s" repeatCount="indefinite" path="M108 224 C260 110 450 338 610 236 S948 108 1092 224"/></circle>
  <circle r="4" fill="var(--accent2)"><animateMotion dur="8s" begin="-5.3s" repeatCount="indefinite" path="M108 224 C260 110 450 338 610 236 S948 108 1092 224"/></circle>
</g>

<!-- pulsing anchors -->
<g>
  <g transform="translate(322 228)"><circle r="5" fill="var(--accent)"/><circle r="12" fill="none" stroke="var(--accent)"><animate attributeName="r" values="8;20;8" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.05;.8" dur="2.2s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(894 232)"><circle r="5" fill="var(--accent2)"/><circle r="12" fill="none" stroke="var(--accent2)"><animate attributeName="r" values="8;20;8" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.05;.8" dur="2.6s" repeatCount="indefinite"/></circle></g>
</g>

<text x="48" y="372" class="muted body">PHASE ∿ CONTINUOUS</text>
<text x="478" y="372" class="muted body">FIELD ↗ EVOLVING</text>
<text x="895" y="372" class="muted body">ATTRACTOR ∞ STABLE / CHAOTIC</text>
</svg>
