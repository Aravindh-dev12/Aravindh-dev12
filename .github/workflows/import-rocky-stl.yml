name: Import exact Rocky STL

on:
  push:
    paths:
      - '.github/workflows/import-rocky-stl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate exact Rocky STL
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL='https://d95a3luo0amge.cloudfront.net/826ddd7c-aa66-4d0e-86ec-2dc212430cdd/projecthailmary/images/project_hail_mary_self_print_rocky.zip'
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/rocky.zip
          rm -rf /tmp/rocky
          mkdir -p /tmp/rocky rocky-3d/assets
          unzip -q -o /tmp/rocky.zip -d /tmp/rocky

          STL_FILE='/tmp/rocky/rocky-statue-figure-files/statue_unsupported/statue_unsupported.stl'
          test -f "$STL_FILE"

          python3 - "$STL_FILE" <<'PY'
          import os, struct, sys
          path = sys.argv[1]
          size = os.path.getsize(path)
          if size < 10_000_000:
              raise SystemExit(f'STL unexpectedly small: {size} bytes')
          with open(path, 'rb') as f:
              f.seek(80)
              triangles = struct.unpack('<I', f.read(4))[0]
          expected_size = 84 + triangles * 50
          if size != expected_size:
              raise SystemExit(f'Not a valid binary STL: size={size}, expected={expected_size}')
          if triangles != 258_432:
              raise SystemExit(f'Unexpected triangle count: {triangles} (expected 258432)')
          print(f'Validated exact Rocky mesh: {triangles:,} triangles, {size:,} bytes')
          PY

          cp "$STL_FILE" rocky-3d/assets/rocky-official.stl

      - name: Commit exact STL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocky-3d/assets/rocky-official.stl
          if git diff --cached --quiet; then
            echo 'STL already up to date.'
            exit 0
          fi
          git commit -m 'Replace stub with exact Rocky STL model'
          git push
