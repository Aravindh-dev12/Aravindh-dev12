name: Render Rocky README model

on:
  push:
    paths:
      - 'tools/render_rocky_readme_browser.mjs'
      - '.github/workflows/render-rocky-readme-animation.yml'
      - 'rocky-model-viewer/index.html'
      - 'rocky-model-viewer/rocky-animated.glb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install capture dependency
        run: npm install --no-save --silent puppeteer-core@24
      - name: Capture original Rocky GLB
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8765 >/tmp/rocky-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME_BIN="$CHROME_BIN" node tools/render_rocky_readme_browser.mjs
      - name: Put original Rocky inside README
        run: |
          mv assets/rocky-readme-original.png /tmp/rocky-readme-original.png
          git pull --rebase origin main
          mv /tmp/rocky-readme-original.png assets/rocky-readme-original.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('README.md')
          s=p.read_text()
          s=re.sub(r'src="\./assets/rocky-readme-[^"]+\.(?:png|gif|webp)"','src="./assets/rocky-readme-original.png"',s,count=1)
          s=re.sub(r'alt="Rocky[^\"]*"','alt="Rocky — original articulated 3D model"',s,count=1)
          p.write_text(s)
          PY
      - name: Commit original Rocky README model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rocky-readme-original.png README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show original Rocky 3D model inside README'
          git push
