<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Aravindhan animated developer profile header</title>
  <desc id="desc">Animated neon lines, particles, and rotating technology labels surrounding Aravindhan's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#12162d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .grid { opacity:.12; }
    .trail { fill:none; stroke:url(#accent); stroke-width:2.2; stroke-linecap:round; stroke-dasharray:12 18; animation:flow 7s linear infinite; }
    .ring { fill:none; stroke:#58a6ff; stroke-width:1.5; opacity:.3; transform-origin:600px 180px; animation:spin 18s linear infinite; }
    .ring.two { stroke:#a371f7; animation-duration:24s; animation-direction:reverse; }
    .pulse { animation:pulse 2.6s ease-in-out infinite; transform-origin:center; }
    .float1 { animation:float1 5s ease-in-out infinite; }
    .float2 { animation:float2 6s ease-in-out infinite; }
    .float3 { animation:float3 4.5s ease-in-out infinite; }
    .cursor { animation:blink 1s steps(2,end) infinite; }
    @keyframes flow { to { stroke-dashoffset:-120; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.92); } 50% { opacity:1; transform:scale(1.08); } }
    @keyframes float1 { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
    @keyframes float2 { 0%,100% { transform:translateY(0); } 50% { transform:translateY(12px); } }
    @keyframes float3 { 0%,100% { transform:translateX(0); } 50% { transform:translateX(10px); } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-color-scheme: light) {
      .panel { fill:#f6f8fa; }
      .primary { fill:#24292f; }
      .secondary { fill:#57606a; }
    }
  </style>
  <rect class="panel" width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g class="grid" stroke="#8b949e" stroke-width="1">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>
  <ellipse class="ring" cx="600" cy="180" rx="430" ry="116" stroke-dasharray="8 14"/>
  <ellipse class="ring two" cx="600" cy="180" rx="355" ry="88" stroke-dasharray="3 17"/>
  <path class="trail" d="M110 250 C300 80 420 310 600 155 S900 80 1090 235"/>
  <g filter="url(#glow)">
    <circle class="pulse" cx="175" cy="218" r="6" fill="#58a6ff"/>
    <circle class="pulse" cx="1015" cy="132" r="6" fill="#a371f7" style="animation-delay:-1.2s"/>
    <circle class="pulse" cx="913" cy="273" r="5" fill="#3fb950" style="animation-delay:-.7s"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
    <text x="600" y="152" class="primary" fill="#f0f6fc" font-size="18" letter-spacing="6">BUILDING SYSTEMS THAT MOVE</text>
    <text x="600" y="205" class="primary" fill="#f0f6fc" font-size="46" font-weight="800">ARAVINDHAN<tspan class="cursor" fill="#58a6ff">_</tspan></text>
    <text x="600" y="240" class="secondary" fill="#8b949e" font-size="16">AI • realtime interfaces • WebGPU • infrastructure • experiments</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c9d1d9">
    <g class="float1"><rect x="96" y="72" width="122" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="157" y="94" text-anchor="middle">AI systems</text></g>
    <g class="float2"><rect x="930" y="70" width="142" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="1001" y="92" text-anchor="middle">realtime UI</text></g>
    <g class="float3"><rect x="136" y="282" width="112" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="192" y="304" text-anchor="middle">WebGPU</text></g>
    <g class="float1" style="animation-delay:-2s"><rect x="944" y="286" width="126" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="1007" y="308" text-anchor="middle">infra</text></g>
  </g>
</svg>
