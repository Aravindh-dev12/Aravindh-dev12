name: Import exact Rocky STL

on:
  push:
    paths:
      - '.github/workflows/import-rocky-stl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Rocky source package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL='https://d95a3luo0amge.cloudfront.net/826ddd7c-aa66-4d0e-86ec-2dc212430cdd/projecthailmary/images/project_hail_mary_self_print_rocky.zip'
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/rocky.zip
          rm -rf /tmp/rocky
          mkdir -p /tmp/rocky rocky-3d/assets/action
          unzip -q -o /tmp/rocky.zip -d /tmp/rocky

          STATUE='/tmp/rocky/rocky-statue-figure-files/statue_unsupported/statue_unsupported.stl'
          PARTS='/tmp/rocky/rocky-statue-figure-files/Action_figure_Unsupported_STLS'
          test -f "$STATUE"
          test -d "$PARTS"

          python3 - "$STATUE" "$PARTS" <<'PY'
          import gzip, json, math, os, shutil, struct, sys
          statue, parts_dir = sys.argv[1:]
          out_dir = 'rocky-3d/assets/action'
          os.makedirs(out_dir, exist_ok=True)

          def inspect_binary_stl(path):
              size = os.path.getsize(path)
              with open(path, 'rb') as f:
                  f.read(80)
                  tri_count = struct.unpack('<I', f.read(4))[0]
                  expected = 84 + tri_count * 50
                  if expected != size:
                      raise SystemExit(f'Not binary STL: {path} size={size} expected={expected}')
                  lo = [math.inf, math.inf, math.inf]
                  hi = [-math.inf, -math.inf, -math.inf]
                  for _ in range(tri_count):
                      vals = struct.unpack('<12fH', f.read(50))
                      for j in range(3):
                          x, y, z = vals[3+j*3:6+j*3]
                          lo[0] = min(lo[0], x); lo[1] = min(lo[1], y); lo[2] = min(lo[2], z)
                          hi[0] = max(hi[0], x); hi[1] = max(hi[1], y); hi[2] = max(hi[2], z)
              return {
                  'bytes': size,
                  'triangles': tri_count,
                  'min': [round(v, 6) for v in lo],
                  'max': [round(v, 6) for v in hi],
                  'size': [round(hi[i]-lo[i], 6) for i in range(3)],
                  'center': [round((hi[i]+lo[i])/2, 6) for i in range(3)],
              }

          statue_info = inspect_binary_stl(statue)
          if statue_info['triangles'] != 258_432 or statue_info['bytes'] != 12_921_684:
              raise SystemExit(f'Unexpected statue mesh: {statue_info}')
          shutil.copy2(statue, 'rocky-3d/assets/rocky-official.stl')

          for old in os.listdir(out_dir):
              if old.endswith('.stl') or old.endswith('.stl.gz'):
                  os.remove(os.path.join(out_dir, old))

          wanted = ['torso.stl'] + [f'{i}-{suffix}.stl' for i in range(1, 6) for suffix in ('A','B')] + ['1-C.stl']
          manifest = {'source':'official Project Hail Mary action-figure STL set','statue':statue_info,'parts':{}}
          for name in wanted:
              src = os.path.join(parts_dir, name)
              if not os.path.isfile(src):
                  raise SystemExit(f'Missing action-figure part: {name}')
              info = inspect_binary_stl(src)
              gz_name = name + '.gz'
              gz_path = os.path.join(out_dir, gz_name)
              with open(src, 'rb') as fin, gzip.open(gz_path, 'wb', compresslevel=9) as fout:
                  shutil.copyfileobj(fin, fout)
              info['gzip'] = gz_name
              info['gzip_bytes'] = os.path.getsize(gz_path)
              manifest['parts'][name] = info

          with open(os.path.join(out_dir, 'manifest.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
          print('Validated statue:', statue_info)
          for name, info in manifest['parts'].items():
              print(name, info['triangles'], 'triangles', info['gzip_bytes'], 'gzip bytes')
          PY

      - name: Commit exact Rocky assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A rocky-3d/assets/action rocky-3d/assets/rocky-official.stl
          if git diff --cached --quiet; then
            echo 'Rocky assets already up to date.'
            exit 0
          fi
          git commit -m 'Compress articulated Rocky parts for web'
          git push
