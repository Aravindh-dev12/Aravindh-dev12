<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated systems orbit</title>
  <desc id="desc">Animated technology nodes orbiting a central build system node.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <style>
    .orbit { fill:none; stroke:#30363d; stroke-width:1.4; stroke-dasharray:6 12; }
    .orbit-a { transform-origin:600px 210px; animation:spin 20s linear infinite; }
    .orbit-b { transform-origin:600px 210px; animation:spinReverse 28s linear infinite; }
    .node { transform-box:fill-box; transform-origin:center; animation:bob 3.6s ease-in-out infinite; }
    .n2 { animation-delay:-.8s; }.n3 { animation-delay:-1.4s; }.n4 { animation-delay:-2.1s; }.n5 { animation-delay:-2.8s; }.n6 { animation-delay:-3.2s; }
    .dash { animation:dash 5s linear infinite; }
    .blink { animation:blink 1.8s ease-in-out infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes spinReverse { to { transform:rotate(-360deg); } }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes dash { to { stroke-dashoffset:-90; } }
    @keyframes blink { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  </style>
  <rect width="1200" height="420" rx="26" fill="#0d1117"/>
  <circle cx="600" cy="210" r="180" fill="url(#core)"/>
  <ellipse class="orbit orbit-a" cx="600" cy="210" rx="390" ry="130"/>
  <ellipse class="orbit orbit-b" cx="600" cy="210" rx="300" ry="95"/>
  <path class="dash" d="M190 210H1010" stroke="#21262d" stroke-width="2" stroke-dasharray="10 18"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
    <g>
      <circle cx="600" cy="210" r="76" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <circle class="blink" cx="600" cy="210" r="88" fill="none" stroke="#58a6ff" stroke-width="1.3"/>
      <text x="600" y="204" fill="#f0f6fc" font-size="20" font-weight="700">BUILD</text>
      <text x="600" y="230" fill="#8b949e" font-size="13">models + UI + infra</text>
    </g>
    <g class="node n1"><rect x="125" y="108" width="150" height="48" rx="24" fill="#161b22" stroke="#58a6ff"/><text x="200" y="138" fill="#c9d1d9" font-size="14">AI / LLMs</text></g>
    <g class="node n2"><rect x="925" y="104" width="152" height="48" rx="24" fill="#161b22" stroke="#a371f7"/><text x="1001" y="134" fill="#c9d1d9" font-size="14">Realtime UX</text></g>
    <g class="node n3"><rect x="140" y="284" width="146" height="48" rx="24" fill="#161b22" stroke="#3fb950"/><text x="213" y="314" fill="#c9d1d9" font-size="14">WebGPU</text></g>
    <g class="node n4"><rect x="910" y="286" width="160" height="48" rx="24" fill="#161b22" stroke="#f78166"/><text x="990" y="316" fill="#c9d1d9" font-size="14">Infrastructure</text></g>
    <g class="node n5"><rect x="420" y="52" width="156" height="48" rx="24" fill="#161b22" stroke="#d2a8ff"/><text x="498" y="82" fill="#c9d1d9" font-size="14">Experiments</text></g>
    <g class="node n6"><rect x="635" y="324" width="166" height="48" rx="24" fill="#161b22" stroke="#79c0ff"/><text x="718" y="354" fill="#c9d1d9" font-size="14">Product systems</text></g>
  </g>
  <text x="42" y="42" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">HOW I LIKE TO BUILD</text>
</svg>
