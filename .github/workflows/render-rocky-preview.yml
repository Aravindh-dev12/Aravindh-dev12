name: Render Rocky README preview

on:
  push:
    paths:
      - '.github/workflows/render-rocky-preview.yml'
      - 'assets/rocky-reference-preview.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract original JPEG from reference SVG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, re
          src = pathlib.Path('assets/rocky-reference-preview.svg').read_text()
          m = re.search(r'data:image/jpeg;base64,([^"\']+)', src)
          if not m:
              raise SystemExit('embedded JPEG not found')
          data = ''.join(m.group(1).split())
          data += '=' * (-len(data) % 4)
          raw = base64.b64decode(data)
          if not raw.startswith(b'\xff\xd8\xff'):
              raise SystemExit('decoded data is not a JPEG')
          out = pathlib.Path('assets/rocky-reference-preview.jpg')
          out.write_bytes(raw)
          print('wrote', out, len(raw), 'bytes')
          PY
          test -s assets/rocky-reference-preview.jpg
          file assets/rocky-reference-preview.jpg

      - name: Commit real README preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rocky-reference-preview.jpg
          if git diff --cached --quiet; then
            echo 'Preview already up to date.'
            exit 0
          fi
          git commit -m 'Add real Rocky README preview image'
          git push
