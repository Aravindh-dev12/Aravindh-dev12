<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>Rocky — Live Eridian 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#dce5ec;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #stage{display:block;width:100vw;height:100vh}
  .hud{position:fixed;z-index:2;left:18px;top:16px;pointer-events:none;text-transform:uppercase;letter-spacing:.08em}
  .hud b{display:block;font-size:12px;color:#dfe8ee;font-weight:650}
  .hud span{display:block;margin-top:5px;font-size:10px;color:#7f8b96}
  .state{color:#6fe0cf!important}
  .controls{position:fixed;z-index:3;left:18px;bottom:16px;display:flex;gap:8px}
  button{appearance:none;border:1px solid #26323c;background:#0b1117;color:#8c9ba8;font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;padding:8px 11px;border-radius:999px;cursor:pointer;text-transform:uppercase}
  button:hover,button.active{border-color:#47746f;color:#baf5ea;background:#0d191a}
  .note{position:fixed;right:16px;bottom:16px;max-width:340px;text-align:right;font-size:9px;line-height:1.5;color:#56616c;letter-spacing:.04em;pointer-events:none}
  @media(max-width:640px){.note{display:none}.controls{bottom:12px}.hud{left:12px;top:12px}.controls{left:12px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud">
  <b>ROCKY / LIVE ERIDIAN 3D</b>
  <span id="state" class="state">state / walking</span>
  <span>drag = orbit · wheel = zoom</span>
</div>
<div class="controls">
  <button id="auto" class="active">auto</button>
  <button id="walk">walk</button>
  <button id="work">work</button>
</div>
<div class="note">fan-made original 3D interpretation · five-limb procedural rig · no official movie model used</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas=document.getElementById('stage');
const stateEl=document.getElementById('state');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07090d);
scene.fog=new THREE.FogExp2(0x07090d,.027);

const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,80);
camera.position.set(7.4,4.8,8.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.enablePan=false;
controls.target.set(0,1.45,0);
controls.minDistance=4.2;
controls.maxDistance=14;
controls.maxPolarAngle=Math.PI*.495;

scene.add(new THREE.HemisphereLight(0x91abc3,0x231a15,1.15));
const key=new THREE.DirectionalLight(0xffd9b5,4.6);
key.position.set(5.5,8,5); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-6; key.shadow.camera.right=6; key.shadow.camera.top=6; key.shadow.camera.bottom=-6; scene.add(key);
const rim=new THREE.DirectionalLight(0x48d5ca,2.6); rim.position.set(-5,4,-5); scene.add(rim);
const fill=new THREE.PointLight(0x4b8cff,22,13,2); fill.position.set(-1,2.8,-4); scene.add(fill);

function rockTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d'); x.fillStyle='#765139'; x.fillRect(0,0,256,256);
  const img=x.getImageData(0,0,256,256);
  for(let i=0;i<img.data.length;i+=4){
    const n=(Math.random()-.5)*48;
    img.data[i]=Math.max(0,Math.min(255,img.data[i]+n));
    img.data[i+1]=Math.max(0,Math.min(255,img.data[i+1]+n*.72));
    img.data[i+2]=Math.max(0,Math.min(255,img.data[i+2]+n*.46));
  }
  x.putImageData(img,0,0); x.globalAlpha=.22; x.strokeStyle='#241b17'; x.lineWidth=2;
  for(let i=0;i<22;i++){
    let px=Math.random()*256,py=Math.random()*256; x.beginPath(); x.moveTo(px,py);
    for(let j=0;j<3;j++){px+=(Math.random()-.5)*32;py+=(Math.random()-.5)*32;x.lineTo(px,py)} x.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1.6,1.6); return t;
}
const texture=rockTexture();
const rockMat=new THREE.MeshStandardMaterial({map:texture,color:0x9a704e,roughness:.91,metalness:.03,bumpMap:texture,bumpScale:.055});
const darkRock=new THREE.MeshStandardMaterial({map:texture,color:0x5d4232,roughness:.94,metalness:.04,bumpMap:texture,bumpScale:.045});
const jointMat=new THREE.MeshStandardMaterial({color:0x2b211c,roughness:.72,metalness:.16});
const mineralMat=new THREE.MeshStandardMaterial({color:0x2bb9a6,emissive:0x0f7168,emissiveIntensity:2.2,roughness:.32,metalness:.12});
const consoleMat=new THREE.MeshStandardMaterial({color:0x0d171d,roughness:.34,metalness:.46});
const holoMat=new THREE.MeshBasicMaterial({color:0x59ead7,transparent:true,opacity:.52,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});

const floor=new THREE.Mesh(new THREE.PlaneGeometry(28,28),new THREE.MeshStandardMaterial({color:0x090d12,roughness:.83,metalness:.04}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const ringFloor=new THREE.Mesh(new THREE.RingGeometry(2.8,3.0,96),new THREE.MeshBasicMaterial({color:0x173139,transparent:true,opacity:.35,side:THREE.DoubleSide}));
ringFloor.rotation.x=-Math.PI/2; ringFloor.position.y=.006; scene.add(ringFloor);

const consoleRig=new THREE.Group(); consoleRig.position.set(2.72,0,0); scene.add(consoleRig);
const consoleBase=new THREE.Mesh(new THREE.CylinderGeometry(.58,.78,.28,28),consoleMat); consoleBase.position.y=.14; consoleBase.castShadow=consoleBase.receiveShadow=true; consoleRig.add(consoleBase);
const consoleStem=new THREE.Mesh(new THREE.CylinderGeometry(.18,.27,1.15,20),consoleMat); consoleStem.position.y=.82; consoleStem.rotation.z=-.08; consoleStem.castShadow=true; consoleRig.add(consoleStem);
const consolePanel=new THREE.Mesh(new THREE.BoxGeometry(1.05,.72,.11),consoleMat); consolePanel.position.set(-.08,1.47,0); consolePanel.rotation.z=-.16; consolePanel.castShadow=true; consoleRig.add(consolePanel);
const holo=new THREE.Mesh(new THREE.PlaneGeometry(.78,.44),holoMat); holo.position.set(-.15,1.48,-.061); holo.rotation.y=Math.PI; holo.rotation.z=-.16; consoleRig.add(holo);
for(let i=0;i<5;i++){const line=new THREE.Mesh(new THREE.PlaneGeometry(.52,.012),holoMat.clone());line.material.opacity=.23+i*.035;line.position.set(-.16,1.34+i*.075,-.068);line.rotation.y=Math.PI;line.rotation.z=-.16;consoleRig.add(line)}

const creature=new THREE.Group(); creature.position.set(-.25,0,0); scene.add(creature);
const body=new THREE.Mesh(new THREE.DodecahedronGeometry(1.05,2),rockMat); body.position.y=2.12; body.scale.set(1.16,.82,1.0); body.castShadow=body.receiveShadow=true; creature.add(body);
const crown=new THREE.Mesh(new THREE.DodecahedronGeometry(.72,1),darkRock); crown.position.set(-.05,2.83,-.03); crown.scale.set(1.04,.48,.92); crown.castShadow=true; creature.add(crown);
const belly=new THREE.Mesh(new THREE.DodecahedronGeometry(.68,1),darkRock); belly.position.set(.02,1.62,.02); belly.scale.set(1.06,.48,.9); belly.castShadow=true; creature.add(belly);
const mineralNodes=[[-.7,2.34,.56,.17],[.58,2.21,.67,.13],[.28,2.64,-.64,.1],[-.16,1.74,.75,.09],[.76,1.96,-.22,.08]];
for(const [x,y,z,r] of mineralNodes){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,2),mineralMat);m.position.set(x,y,z);m.scale.set(1.4,.65,.5);m.castShadow=true;creature.add(m)}
const scarMat=new THREE.LineBasicMaterial({color:0x3a2a22,transparent:true,opacity:.85});
function scar(points){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));creature.add(new THREE.Line(g,scarMat))}
scar([[-.45,2.58,.91],[-.15,2.42,.99],[.05,2.55,.98],[.31,2.36,.92]]); scar([[-.18,2.03,1.02],[-.03,1.9,1.01],[.12,1.98,.98]]);

function capsuleMesh(radius=1){const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(radius,1,6,14),rockMat.clone());mesh.castShadow=mesh.receiveShadow=true;return mesh}
function alignCapsule(mesh,a,b,r=.19){const d=b.clone().sub(a),len=d.length();mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());mesh.scale.set(1,Math.max(.001,len/(1+2*r)),1)}
function makeFoot(group){const foot=new THREE.Group();group.add(foot);const palm=new THREE.Mesh(new THREE.DodecahedronGeometry(.25,1),darkRock);palm.scale.set(1.25,.55,.9);palm.castShadow=true;foot.add(palm);const toes=[];for(let j=-1;j<=1;j++){const toe=new THREE.Mesh(new THREE.ConeGeometry(.085,.44,8),darkRock);toe.rotation.z=-Math.PI/2;toe.rotation.y=j*.42;toe.position.set(.3,0,j*.09);toe.castShadow=true;foot.add(toe);toes.push(toe)}return{foot,toes}}

const limbs=[]; const angles=[0,Math.PI*2/5,Math.PI*4/5,Math.PI*6/5,Math.PI*8/5];
for(let i=0;i<5;i++){const g=new THREE.Group();g.rotation.y=angles[i];creature.add(g);const shoulder=new THREE.Mesh(new THREE.IcosahedronGeometry(.27,2),jointMat);shoulder.castShadow=true;g.add(shoulder);const upper=capsuleMesh(.2),lower=capsuleMesh(.19);g.add(upper,lower);const knee=new THREE.Mesh(new THREE.IcosahedronGeometry(.24,2),jointMat);knee.castShadow=true;g.add(knee);const {foot,toes}=makeFoot(g);limbs.push({g,shoulder,upper,lower,knee,foot,toes,index:i,angle:angles[i],phase:i/5})}
function iBend(i){return(i===0||i===1)?1:-1}
function solveLimb(L,target,reachBias=0){
  const S=new THREE.Vector3(.82,2.04,0),len1=1.18,len2=1.2,T=target.clone();
  const dx=T.x-S.x,dy=T.y-S.y,dist=Math.min(len1+len2-.03,Math.max(.2,Math.hypot(dx,dy))),ux=dx/dist,uy=dy/dist;
  const a=(len1*len1-len2*len2+dist*dist)/(2*dist),h=Math.sqrt(Math.max(0,len1*len1-a*a)),bend=iBend(L.index);
  const K=new THREE.Vector3(S.x+ux*a-uy*h*bend,S.y+uy*a+ux*h*bend,reachBias);
  L.shoulder.position.copy(S);L.knee.position.copy(K);alignCapsule(L.upper,S,K,.2);alignCapsule(L.lower,K,T,.19);L.foot.position.copy(T);L.foot.rotation.z=-.08;
}

let mode='auto',displayedState='';
const setActive=id=>{for(const x of ['auto','walk','work'])document.getElementById(x).classList.toggle('active',x===id)};
for(const id of ['auto','walk','work'])document.getElementById(id).onclick=()=>{mode=id;setActive(id)};
const clock=new THREE.Clock();
function smoothstep(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
function walkTarget(L,t){const p=(t*.72+L.phase)%1,stance=.64;let x,y;if(p<stance){const q=p/stance;x=2.08+THREE.MathUtils.lerp(.34,-.34,q);y=.18}else{const q=(p-stance)/(1-stance);x=2.08+THREE.MathUtils.lerp(-.34,.34,q);y=.18+Math.sin(Math.PI*q)*.42}return new THREE.Vector3(x,y,0)}
function plantedTarget(i,t){return new THREE.Vector3(2.02+Math.sin(t*.65+i)*.035,.18,0)}
function workTarget(L,t){if(L.index===0)return new THREE.Vector3(2.13,1.34+Math.sin(t*3.2)*.13,0);return plantedTarget(L.index,t)}

function animate(){
  requestAnimationFrame(animate); const t=clock.getElapsedTime(),autoPhase=t%18;
  const isWorking=mode==='work'||(mode==='auto'&&autoPhase>10.2&&autoPhase<15.8);
  const transition=mode==='auto'?Math.min(smoothstep(9.5,10.7,autoPhase),1-smoothstep(15.2,16.2,autoPhase)):(isWorking?1:0);
  const workMix=isWorking?Math.max(.15,transition):0,label=isWorking?'working':'walking';
  if(label!==displayedState){displayedState=label;stateEl.textContent=`state / ${label}`}
  let supportX=0,supportZ=0,supportN=0;
  for(const L of limbs){
    const target=walkTarget(L,t).lerp(workTarget(L,t),workMix); solveLimb(L,target,L.index===0&&isWorking?Math.sin(t*2.7)*.025:0);
    const p=(t*.72+L.phase)%1;if(p<.64||isWorking){supportX+=Math.cos(L.angle);supportZ+=Math.sin(L.angle);supportN++}
    const fingerFlex=(L.index===0&&isWorking)?(.18+.12*Math.sin(t*5.2)):0;L.toes.forEach((toe,j)=>{toe.rotation.y=j*.42+(j-1)*fingerFlex});
  }
  const sx=supportN?supportX/supportN:0,sz=supportN?supportZ/supportN:0;
  creature.position.x=-.25-sx*.055;creature.position.z=-sz*.055;creature.position.y=.025+Math.sin(t*2.25)*.026*(1-workMix);
  creature.rotation.z=-sx*.018+Math.sin(t*.9)*.006;creature.rotation.x=sz*.015+Math.sin(t*.73)*.004;
  body.rotation.y=Math.sin(t*.45)*.025;crown.rotation.y=-body.rotation.y*.7+Math.sin(t*1.7)*.01;belly.rotation.y=body.rotation.y*.45;
  mineralMat.emissiveIntensity=1.85+Math.sin(t*2.4)*.28;holo.material.opacity=isWorking?.62:.22;holo.scale.setScalar(isWorking?1+Math.sin(t*3)*.025:.92);
  consoleRig.rotation.y=Math.sin(t*.18)*.018;ringFloor.material.opacity=.28+Math.sin(t*.7)*.05;controls.update();renderer.render(scene,camera);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
animate();
</script>
</body>
</html>
