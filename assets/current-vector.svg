<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="ARAVINDHAN / CURRENT.VECTOR — system quest gamefield">
<style>
  :root{--fg:#c9d1d9;--muted:#9aa4af;--faint:#30363d;--blue:#58a6ff;--purple:#bc8cff;--green:#3fb950;--panel:#0d1117;--panel2:#111820}
  .bg{fill:var(--panel)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}
  .label{font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
  .small{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
  .divider{stroke:var(--faint);stroke-width:1}
  .grid{stroke:var(--faint);stroke-width:.8;opacity:.34}
  .route{fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .routeHot{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 14;opacity:.74;animation:dash 5s linear infinite}
  .gate{fill:var(--panel2);stroke-width:1.6}
  .hud{fill:var(--panel2);stroke:var(--faint);stroke-width:1}
  @keyframes dash{to{stroke-dashoffset:-110}}
  @media(prefers-color-scheme:light){:root{--fg:#24292f;--muted:#57606a;--faint:#d0d7de;--blue:#0969da;--purple:#8250df;--green:#1a7f37;--panel:#fff;--panel2:#f6f8fa}}
</style>

<defs>
  <pattern id="gameGrid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" class="grid"/>
  </pattern>
</defs>

<rect class="bg" width="1200" height="340" rx="18"/>
<text x="48" y="44" class="fg label">ARAVINDHAN / CURRENT.VECTOR</text>
<text x="48" y="69" class="muted small">system quest · ideas become playable systems through progressive unlocks</text>
<line x1="48" y1="88" x2="1152" y2="88" class="divider"/>

<text x="48" y="119" class="muted label">02 / BUILD.FIELD</text>
<text x="48" y="143" class="fg small">MISSION: discover → prototype → connect → deploy</text>

<!-- Game field -->
<rect x="48" y="158" width="1104" height="126" rx="14" fill="url(#gameGrid)" stroke="var(--faint)" stroke-width="1"/>

<!-- Route -->
<path id="questRoute" class="route" d="M92 236 L248 194 L410 246 L570 194 L744 242 L900 194 L1088 226"/>
<path class="routeHot" d="M92 236 L248 194 L410 246 L570 194 L744 242 L900 194 L1088 226"/>

<!-- Spawn beacon -->
<circle cx="92" cy="236" r="18" fill="none" stroke="var(--green)" opacity=".45">
  <animate attributeName="r" values="10;25;10" dur="2.6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".8;.08;.8" dur="2.6s" repeatCount="indefinite"/>
</circle>
<circle cx="92" cy="236" r="5" fill="var(--green)"/>
<text x="68" y="270" class="muted tiny">SPAWN</text>

<!-- Checkpoint 1 -->
<rect x="226" y="172" width="44" height="44" rx="8" class="gate" stroke="var(--blue)"/>
<path d="M237 194h22M248 183v22" stroke="var(--blue)" stroke-width="2" opacity=".9"/>
<rect x="232" y="178" width="32" height="32" rx="6" fill="none" stroke="var(--blue)" opacity=".55">
  <animateTransform attributeName="transform" type="rotate" from="0 248 194" to="360 248 194" dur="8s" repeatCount="indefinite"/>
</rect>
<text x="205" y="270" class="fg tiny">RESEARCH</text>

<!-- Checkpoint 2 -->
<circle cx="410" cy="246" r="22" class="gate" stroke="var(--purple)"/>
<circle cx="410" cy="246" r="10" fill="none" stroke="var(--purple)" stroke-width="2">
  <animate attributeName="r" values="7;14;7" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
</circle>
<text x="381" y="270" class="fg tiny">AGENTS</text>

<!-- Checkpoint 3 -->
<polygon points="570,170 594,194 570,218 546,194" class="gate" stroke="var(--green)"/>
<polygon points="570,180 584,194 570,208 556,194" fill="none" stroke="var(--green)" stroke-width="1.8">
  <animateTransform attributeName="transform" type="rotate" from="0 570 194" to="360 570 194" dur="6s" repeatCount="indefinite"/>
</polygon>
<text x="527" y="270" class="fg tiny">MULTIMODAL</text>

<!-- Checkpoint 4 -->
<rect x="721" y="219" width="46" height="46" rx="23" class="gate" stroke="var(--blue)"/>
<path d="M732 242h24M744 230v24" stroke="var(--blue)" stroke-width="2"/>
<circle cx="744" cy="242" r="18" fill="none" stroke="var(--blue)" stroke-dasharray="3 6">
  <animateTransform attributeName="transform" type="rotate" from="360 744 242" to="0 744 242" dur="7s" repeatCount="indefinite"/>
</circle>
<text x="716" y="270" class="fg tiny">WEBGPU</text>

<!-- Checkpoint 5 -->
<rect x="878" y="172" width="44" height="44" rx="8" class="gate" stroke="var(--purple)"/>
<path d="M890 201l10-14 10 14z" fill="none" stroke="var(--purple)" stroke-width="1.8"/>
<circle cx="900" cy="194" r="16" fill="none" stroke="var(--purple)" opacity=".65">
  <animate attributeName="r" values="12;21;12" dur="3s" repeatCount="indefinite"/>
</circle>
<text x="879" y="270" class="fg tiny">INFRA</text>

<!-- Final portal -->
<g>
  <circle cx="1088" cy="226" r="31" fill="none" stroke="var(--green)" stroke-width="1.3" stroke-dasharray="5 8"/>
  <circle cx="1088" cy="226" r="20" fill="none" stroke="var(--purple)" stroke-width="1.3"/>
  <circle cx="1088" cy="226" r="8" fill="var(--panel2)" stroke="var(--blue)" stroke-width="1.5"/>
  <animateTransform attributeName="transform" type="rotate" from="0 1088 226" to="360 1088 226" dur="9s" repeatCount="indefinite"/>
</g>
<text x="1059" y="270" class="fg tiny">DEPLOY</text>

<!-- Player token: moving diamond with pulse -->
<g>
  <polygon points="0,-8 8,0 0,8 -8,0" fill="var(--green)" stroke="var(--fg)" stroke-width="1.2"/>
  <circle r="13" fill="none" stroke="var(--green)" opacity=".28">
    <animate attributeName="r" values="9;17;9" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;.08;.65" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M92 236 L248 194 L410 246 L570 194 L744 242 L900 194 L1088 226"/>
</g>

<!-- Ghost runner for a game-like chase effect -->
<g opacity=".48">
  <circle r="4.5" fill="var(--blue)"/>
  <animateMotion dur="8s" begin="-2.6s" repeatCount="indefinite" path="M92 236 L248 194 L410 246 L570 194 L744 242 L900 194 L1088 226"/>
</g>
<g opacity=".34">
  <circle r="3.5" fill="var(--purple)"/>
  <animateMotion dur="8s" begin="-5.2s" repeatCount="indefinite" path="M92 236 L248 194 L410 246 L570 194 L744 242 L900 194 L1088 226"/>
</g>

<!-- XP HUD -->
<rect x="48" y="302" width="1104" height="20" rx="10" class="hud"/>
<text x="62" y="316" class="fg tiny">XP</text>
<rect x="92" y="308" width="930" height="8" rx="4" fill="var(--faint)"/>
<rect x="92" y="308" height="8" rx="4" fill="var(--green)">
  <animate attributeName="width" values="0;930;0" dur="8s" repeatCount="indefinite"/>
</rect>
<text x="1042" y="316" class="muted tiny">LEVEL: SYSTEM BUILDER</text>
</svg>
