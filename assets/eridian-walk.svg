<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Living five-limbed cracked-stone creature walking across the profile">
  <defs>
    <radialGradient id="torso" cx="33%" cy="24%" r="78%">
      <stop offset="0" stop-color="#d0a37b"/>
      <stop offset=".22" stop-color="#b18462"/>
      <stop offset=".52" stop-color="#876247"/>
      <stop offset=".78" stop-color="#634536"/>
      <stop offset="1" stop-color="#3c2a23"/>
    </radialGradient>
    <linearGradient id="upper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c39570"/>
      <stop offset=".28" stop-color="#9c7254"/>
      <stop offset=".68" stop-color="#6c4b3b"/>
      <stop offset="1" stop-color="#422f28"/>
    </linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f674d"/>
      <stop offset=".62" stop-color="#654638"/>
      <stop offset="1" stop-color="#392922"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efd0aa" stop-opacity=".65"/>
      <stop offset="1" stop-color="#efd0aa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="teal" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#75d1ba"/>
      <stop offset=".42" stop-color="#3ca58c"/>
      <stop offset="1" stop-color="#1e6c60"/>
    </radialGradient>

    <filter id="rockTex" x="-35%" y="-35%" width="170%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency=".032" numOctaves="4" seed="14" result="n"/>
      <feColorMatrix in="n" type="matrix" values=".42 0 0 0 .32  0 .34 0 0 .23  0 0 .26 0 .18  0 0 0 .28 0" result="stoneNoise"/>
      <feBlend in="SourceGraphic" in2="stoneNoise" mode="multiply" result="t"/>
      <feSpecularLighting in="n" surfaceScale="2" specularConstant=".35" specularExponent="18" lighting-color="#f0d2ac" result="spec">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="specClip"/>
      <feBlend in="t" in2="specClip" mode="screen"/>
    </filter>

    <filter id="bodyShadow" x="-50%" y="-80%" width="210%" height="230%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="ground" x="-120%" y="-400%" width="340%" height="900%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <g id="rock-leg">
      <!-- shoulder / upper limb -->
      <path d="M-15 0 C-4 -10 14 -12 28 -4 C40 3 47 15 46 29 C45 42 39 57 31 70 C25 81 10 86 -3 80 C-16 73 -21 61 -16 48 L-8 28 C-4 18 -23 8 -15 0 Z" fill="url(#upper)" stroke="#3c2922" stroke-width="2.1"/>
      <path d="M-7 3 C4 -3 20 -1 31 7" fill="none" stroke="url(#highlight)" stroke-width="4" stroke-linecap="round"/>
      <path d="M-12 23 L0 29 L10 21 L23 29 L35 20" fill="none" stroke="#4a3329" stroke-width="2" opacity=".88"/>
      <path d="M-10 50 L3 56 L15 48 L29 55" fill="none" stroke="#493229" stroke-width="2" opacity=".78"/>
      <path d="M14 9 C23 7 31 10 35 15 C32 22 24 25 16 22 C11 19 10 13 14 9 Z" fill="url(#teal)" opacity=".88"/>

      <!-- elbow -->
      <ellipse cx="18" cy="74" rx="17" ry="13" fill="#7e5945" stroke="#3c2922" stroke-width="2"/>
      <path d="M8 70 C14 65 23 65 29 69" fill="none" stroke="#c08f6b" stroke-opacity=".42" stroke-width="2.5"/>

      <!-- lower limb -->
      <g transform="translate(18 75)">
        <path d="M-13 0 C-2 -8 14 -5 22 6 C29 16 27 30 21 44 L10 68 C5 80 -9 87 -21 82 C-32 77 -37 66 -31 54 L-20 32 C-15 22 -23 8 -13 0 Z" fill="url(#lower)" stroke="#35261f" stroke-width="2.1"/>
        <path d="M-8 5 C0 1 12 3 18 9" fill="none" stroke="#c99a76" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>
        <path d="M-24 34 L-12 39 L-2 33 L10 39 L20 32" fill="none" stroke="#3d2a23" stroke-width="2" opacity=".9"/>
        <path d="M-16 61 C-8 57 2 59 7 64 C4 70 -4 74 -12 71 C-17 69 -19 65 -16 61 Z" fill="url(#teal)" opacity=".7"/>

        <!-- broad stony foot -->
        <path d="M-31 70 C-18 65 2 66 13 73 C12 84 2 92 -12 94 C-24 95 -34 89 -37 81 C-39 77 -36 73 -31 70 Z" fill="#463229" stroke="#2d211c" stroke-width="2"/>
        <path d="M-27 75 C-17 72 -4 73 5 77" fill="none" stroke="#9b6c50" stroke-opacity=".5" stroke-width="2.4"/>
      </g>
    </g>
  </defs>

  <!-- only a soft contact shadow; the SVG itself has no background -->
  <g transform="translate(115 0)">
    <animateTransform attributeName="transform" type="translate" values="115 0;885 0;885 0;115 0" keyTimes="0;.44;.54;1" dur="18s" repeatCount="indefinite"/>

    <ellipse cx="0" cy="193" rx="75" ry="9" fill="#000" opacity=".24" filter="url(#ground)">
      <animate attributeName="rx" values="75;61;73;60;75" dur="1.12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".24;.14;.23;.13;.24" dur="1.12s" repeatCount="indefinite"/>
    </ellipse>

    <g filter="url(#bodyShadow)">
      <!-- turn around naturally at each edge -->
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;-1 1;-1 1" keyTimes="0;.44;.54;1" dur="18s" repeatCount="indefinite"/>

      <!-- body rise/fall follows the stepping rhythm -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 2;0 -5;0 0;0 -4;0 2" dur="1.12s" repeatCount="indefinite"/>

        <!-- far rear limb -->
        <g transform="translate(-50 92) rotate(72) scale(.72)">
          <animateTransform attributeName="transform" additive="sum" type="rotate" values="14 0 0;-12 0 0;14 0 0" dur="1.12s" begin="-.56s" repeatCount="indefinite"/>
          <use href="#rock-leg" opacity=".74"/>
        </g>

        <!-- far front limb -->
        <g transform="translate(48 91) rotate(-72) scale(.75)">
          <animateTransform attributeName="transform" additive="sum" type="rotate" values="-12 0 0;15 0 0;-12 0 0" dur="1.12s" begin="-.28s" repeatCount="indefinite"/>
          <use href="#rock-leg" opacity=".8"/>
        </g>

        <!-- lower center fifth limb, visible under the torso -->
        <g transform="translate(2 114) rotate(3) scale(.64)">
          <animateTransform attributeName="transform" additive="sum" type="rotate" values="9 0 0;-10 0 0;9 0 0" dur="1.12s" begin="-.84s" repeatCount="indefinite"/>
          <use href="#rock-leg"/>
        </g>

        <!-- torso / shell -->
        <g filter="url(#rockTex)">
          <animateTransform attributeName="transform" type="rotate" values="-1.5 0 92;1.5 0 92;-1.5 0 92" dur="2.24s" repeatCount="indefinite"/>

          <!-- round upper shell -->
          <path d="M-63 62 C-48 43 -24 34 4 35 C34 36 57 47 67 65 C77 83 76 107 64 126 C51 147 27 158 -1 158 C-29 158 -52 147 -64 128 C-77 108 -78 82 -63 62 Z" fill="url(#torso)" stroke="#3a2922" stroke-width="2.6"/>

          <!-- thick cap like the reference model -->
          <path d="M-55 59 C-35 40 0 34 29 42 C48 47 62 57 66 69 C42 62 17 59 -9 62 C-28 64 -45 69 -65 78 C-64 69 -61 64 -55 59 Z" fill="#aa7c59" stroke="#4a3329" stroke-width="2.2"/>
          <path d="M-45 54 C-23 45 8 44 34 52" fill="none" stroke="#e1b68f" stroke-opacity=".5" stroke-width="4.5" stroke-linecap="round"/>

          <!-- front face plate -->
          <path d="M-39 74 C-17 68 19 69 42 77 C50 92 48 112 37 128 C17 137 -14 137 -37 127 C-48 111 -49 91 -39 74 Z" fill="#775440" stroke="#392821" stroke-width="2.2"/>

          <!-- stone cracks -->
          <path d="M-55 82 L-40 88 L-28 78 L-15 87 L0 76 L15 87 L31 78 L48 86" fill="none" stroke="#3e2b24" stroke-width="2.2" opacity=".95"/>
          <path d="M-32 125 L-20 114 L-8 121 L4 108 L17 119 L32 106" fill="none" stroke="#3c2a23" stroke-width="2.1" opacity=".9"/>
          <path d="M-11 39 L-7 58 L4 69" fill="none" stroke="#433027" stroke-width="2"/>
          <path d="M29 45 L22 61 L32 72" fill="none" stroke="#433027" stroke-width="2"/>
          <path d="M-44 55 L-34 69" fill="none" stroke="#433027" stroke-width="2"/>
          <path d="M48 58 L39 73" fill="none" stroke="#433027" stroke-width="2"/>

          <!-- turquoise mineral marks -->
          <path d="M-47 61 C-38 55 -28 57 -23 63 C-25 71 -35 75 -44 72 C-50 69 -51 65 -47 61 Z" fill="url(#teal)" opacity=".92"/>
          <path d="M42 67 C49 62 59 64 63 71 C60 79 52 82 44 79 C39 76 38 71 42 67 Z" fill="url(#teal)" opacity=".85"/>
          <path d="M-7 144 C0 140 9 141 13 146 C10 152 4 154 -4 152 C-9 150 -10 147 -7 144 Z" fill="url(#teal)" opacity=".6"/>
        </g>

        <!-- near left weight-bearing limb -->
        <g transform="translate(-44 91) rotate(18) scale(.94)">
          <animateTransform attributeName="transform" additive="sum" type="rotate" values="-18 0 0;17 0 0;-18 0 0" dur="1.12s" repeatCount="indefinite"/>
          <use href="#rock-leg"/>
        </g>

        <!-- near right weight-bearing limb, opposite phase -->
        <g transform="translate(44 91) rotate(-18) scale(.94)">
          <animateTransform attributeName="transform" additive="sum" type="rotate" values="18 0 0;-17 0 0;18 0 0" dur="1.12s" begin="-.56s" repeatCount="indefinite"/>
          <use href="#rock-leg"/>
        </g>
      </g>
    </g>
  </g>
</svg>