name: Build Rocky animated GLB

on:
  push:
    paths:
      - 'tools/build_rocky_animated_glb.py'
      - '.github/workflows/build-rocky-model-viewer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install mesh tooling
        run: python3 -m pip install --quiet numpy trimesh
      - name: Build animated GLB
        run: python3 tools/build_rocky_animated_glb.py
      - name: Verify GLB
        run: |
          ls -lh rocky-model-viewer/rocky-animated.glb
          python3 - <<'PY'
          import struct
          p='rocky-model-viewer/rocky-animated.glb'
          b=open(p,'rb').read(12)
          magic,version,size=struct.unpack('<4sII',b)
          assert magic==b'glTF' and version==2
          print('valid GLB header, bytes:', size)
          PY
      - name: Commit generated model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocky-model-viewer/rocky-animated.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate animated Rocky GLB'
          git push
