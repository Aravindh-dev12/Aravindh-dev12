<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="VECTOR STORM animated mathematical arcade arena">
<style>
  :root{--bg:#0d1117;--panel:#111820;--fg:#e6edf3;--muted:#9aa4af;--faint:#30363d;--blue:#58a6ff;--purple:#bc8cff;--green:#3fb950;--red:#f85149;--gold:#d29922}
  .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--faint);stroke-width:1}.fg{fill:var(--fg)}.muted{fill:var(--muted)}
  .title{font:700 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}.label{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}.small{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tiny{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
  .grid{stroke:var(--faint);stroke-width:.8;opacity:.28}.ring{fill:none;stroke:var(--faint)}.vector{stroke:var(--blue);stroke-width:1.2;opacity:.45}.dash{stroke-dasharray:5 8}.beam{stroke-width:2;stroke-linecap:round}
  @media(prefers-color-scheme:light){:root{--bg:#fff;--panel:#f6f8fa;--fg:#24292f;--muted:#57606a;--faint:#d0d7de;--blue:#0969da;--purple:#8250df;--green:#1a7f37;--red:#cf222e;--gold:#9a6700}}
</style>
<defs>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" class="grid"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <path id="playerPath" d="M430 270 C520 150 720 145 835 225 C940 300 885 347 760 330 C620 312 510 350 430 270 Z"/>
  <path id="enemyPath" d="M640 235 C710 170 840 180 900 245 C950 300 875 345 800 320 C720 295 670 300 640 235 Z"/>
</defs>

<rect class="bg" width="1200" height="420" rx="18"/>
<text x="46" y="46" class="fg title">ARAVINDHAN / VECTOR.STORM</text>
<text x="46" y="72" class="muted small">arcade field · dodge the flow · orbit the attractor · survive the boss phase</text>
<line x1="46" y1="92" x2="1154" y2="92" stroke="var(--faint)"/>

<!-- HUD -->
<rect x="46" y="116" width="238" height="248" rx="14" class="panel"/>
<text x="64" y="145" class="muted label">RUN STATE</text>
<text x="64" y="176" class="fg small">LEVEL</text><text x="208" y="176" class="fg small">07</text>
<text x="64" y="202" class="fg small">WAVE</text><text x="208" y="202" class="fg small">BOSS</text>
<text x="64" y="228" class="fg small">FIELD</text><text x="208" y="228" class="fg small">CHAOTIC</text>
<text x="64" y="254" class="fg small">COMBO</text><text x="208" y="254" class="fg small">×12</text>
<text x="64" y="286" class="muted tiny">ENERGY</text>
<rect x="64" y="298" width="184" height="10" rx="5" fill="var(--faint)"/>
<rect x="64" y="298" height="10" rx="5" fill="var(--green)">
  <animate attributeName="width" values="42;168;112;176;42" dur="8s" repeatCount="indefinite"/>
</rect>
<text x="64" y="330" class="muted tiny">DANGER</text>
<circle cx="118" cy="326" r="4" fill="var(--red)"><animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite"/></circle>
<circle cx="136" cy="326" r="4" fill="var(--red)"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
<circle cx="154" cy="326" r="4" fill="var(--red)"><animate attributeName="opacity" values=".3;1;.3" dur=".8s" repeatCount="indefinite"/></circle>

<!-- arena -->
<rect x="310" y="116" width="844" height="248" rx="14" fill="url(#g)" stroke="var(--faint)"/>
<text x="330" y="143" class="muted label">07 / CHAOS ARENA</text>
<text x="992" y="143" class="muted tiny">TARGET: STABLE ATTRACTOR</text>

<!-- vector field arrows -->
<g opacity=".42">
  <g transform="translate(360 180)"><path d="M0 0h30l-7-6m7 6-7 6" class="vector"><animateTransform attributeName="transform" type="rotate" values="0 0 0;35 0 0;0 0 0;-25 0 0;0 0 0" dur="5s" repeatCount="indefinite"/></path></g>
  <g transform="translate(430 210)"><path d="M0 0h32l-7-6m7 6-7 6" class="vector"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-45 0 0;20 0 0;0 0 0" dur="4.2s" repeatCount="indefinite"/></path></g>
  <g transform="translate(520 170)"><path d="M0 0h30l-7-6m7 6-7 6" class="vector"><animateTransform attributeName="transform" type="rotate" values="0 0 0;55 0 0;0 0 0" dur="3.6s" repeatCount="indefinite"/></path></g>
  <g transform="translate(540 315)"><path d="M0 0h30l-7-6m7 6-7 6" class="vector"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-60 0 0;15 0 0;0 0 0" dur="4.8s" repeatCount="indefinite"/></path></g>
  <g transform="translate(970 180)"><path d="M0 0h30l-7-6m7 6-7 6" class="vector"><animateTransform attributeName="transform" type="rotate" values="0 0 0;70 0 0;-20 0 0;0 0 0" dur="4.1s" repeatCount="indefinite"/></path></g>
  <g transform="translate(1030 305)"><path d="M0 0h30l-7-6m7 6-7 6" class="vector"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-40 0 0;30 0 0;0 0 0" dur="5.4s" repeatCount="indefinite"/></path></g>
</g>

<!-- boss attractor -->
<g transform="translate(790 238)" filter="url(#glow)">
  <circle r="70" class="ring dash" stroke="var(--purple)" stroke-width="1.4"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></circle>
  <circle r="48" class="ring" stroke="var(--blue)" stroke-width="1.5"><animate attributeName="r" values="42;54;42" dur="3.2s" repeatCount="indefinite"/></circle>
  <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="var(--panel)" stroke="var(--red)" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5s" repeatCount="indefinite"/>
  </polygon>
  <circle r="8" fill="var(--red)"><animate attributeName="r" values="6;11;6" dur="1.1s" repeatCount="indefinite"/></circle>
</g>

<!-- orbiting enemy drones -->
<g>
  <g><circle r="7" fill="var(--purple)" stroke="var(--fg)" stroke-width="1"/><animateMotion dur="6.5s" repeatCount="indefinite" path="M640 235 C710 170 840 180 900 245 C950 300 875 345 800 320 C720 295 670 300 640 235 Z"/></g>
  <g><circle r="6" fill="var(--blue)"/><animateMotion dur="6.5s" begin="-2.1s" repeatCount="indefinite" path="M640 235 C710 170 840 180 900 245 C950 300 875 345 800 320 C720 295 670 300 640 235 Z"/></g>
  <g><circle r="5" fill="var(--gold)"/><animateMotion dur="6.5s" begin="-4.2s" repeatCount="indefinite" path="M640 235 C710 170 840 180 900 245 C950 300 875 345 800 320 C720 295 670 300 640 235 Z"/></g>
</g>

<!-- player ship -->
<g filter="url(#glow)">
  <polygon points="0,-12 9,10 0,6 -9,10" fill="var(--green)" stroke="var(--fg)" stroke-width="1.2"/>
  <circle r="16" fill="none" stroke="var(--green)" opacity=".38"><animate attributeName="r" values="12;21;12" dur="1.3s" repeatCount="indefinite"/></circle>
  <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M430 270 C520 150 720 145 835 225 C940 300 885 347 760 330 C620 312 510 350 430 270 Z"/>
</g>

<!-- ghost trail -->
<g opacity=".55"><circle r="5" fill="var(--green)"/><animateMotion dur="8s" begin="-.35s" repeatCount="indefinite" path="M430 270 C520 150 720 145 835 225 C940 300 885 347 760 330 C620 312 510 350 430 270 Z"/></g>
<g opacity=".28"><circle r="4" fill="var(--green)"/><animateMotion dur="8s" begin="-.7s" repeatCount="indefinite" path="M430 270 C520 150 720 145 835 225 C940 300 885 347 760 330 C620 312 510 350 430 270 Z"/></g>

<!-- projectiles from boss -->
<g>
  <circle r="4" fill="var(--red)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M790 238 C700 220 610 210 500 260"/></circle>
  <circle r="3.5" fill="var(--purple)"><animateMotion dur="2.8s" begin="-.9s" repeatCount="indefinite" path="M790 238 C850 180 950 180 1080 250"/></circle>
  <circle r="3.5" fill="var(--blue)"><animateMotion dur="3.1s" begin="-1.6s" repeatCount="indefinite" path="M790 238 C740 305 650 340 540 320"/></circle>
</g>

<!-- sweeping hazard lasers -->
<g transform="translate(790 238)" opacity=".7">
  <line x1="0" y1="0" x2="145" y2="0" stroke="var(--red)" class="beam">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
  </line>
</g>
<g transform="translate(790 238)" opacity=".38">
  <line x1="0" y1="0" x2="-130" y2="0" stroke="var(--purple)" class="beam">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
  </line>
</g>

<!-- impact flashes -->
<circle cx="1000" cy="285" r="8" fill="none" stroke="var(--red)" opacity="0"><animate attributeName="r" values="4;28;4" dur="2.6s" begin="-.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="2.6s" begin="-.4s" repeatCount="indefinite"/></circle>
<circle cx="505" cy="190" r="8" fill="none" stroke="var(--blue)" opacity="0"><animate attributeName="r" values="4;24;4" dur="3.4s" begin="-1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="3.4s" begin="-1.8s" repeatCount="indefinite"/></circle>

<!-- bottom status -->
<text x="330" y="390" class="muted tiny">MOVE: VECTOR FLOW</text>
<text x="510" y="390" class="muted tiny">DODGE: ROTATING HAZARDS</text>
<text x="750" y="390" class="muted tiny">BOSS: CHAOTIC ATTRACTOR</text>
<text x="1010" y="390" class="muted tiny">SURVIVE ∞</text>
</svg>
